<svg xmlns="http://www.w3.org/2000/svg" width="380" height="560" viewBox="0 0 380 560" font-family="'Poppins','Inter',Segoe UI,sans-serif">
  <defs>
    <linearGradient id="heroA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52B788"/><stop offset="1" stop-color="#00B37E"/>
    </linearGradient>
    <filter id="shA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1B4332" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="380" height="560" fill="#F7FAF8"/>
  <text x="20" y="24" font-size="13" font-weight="700" fill="#1B4332">Direção final — cabeçalho clean (B) + 2 cards verdes</text>

  <!-- cabecalho estilo B: VUPTH em cima, "Minha fila" abaixo -->
  <text x="20" y="64" font-size="18" font-weight="800" fill="#1B4332" letter-spacing="1">VUPTH</text>
  <!-- avaliacao + figurinha do tipo, no canto -->
  <text x="312" y="60" font-size="13" font-weight="600" fill="#E0A100" text-anchor="end">★ 4.8</text>
  <circle cx="346" cy="55" r="14" fill="#EAF2EE"/><text x="346" y="60" font-size="13" text-anchor="middle" fill="#1B4332">✂</text>

  <text x="20" y="104" font-size="24" font-weight="700" fill="#111827">Minha fila</text>

  <!-- 2 CARDS VERDES: pessoas + espera (sem ~) -->
  <g filter="url(#shA)"><rect x="20" y="120" width="164" height="84" rx="20" fill="url(#heroA)"/></g>
  <text x="38" y="150" font-size="11.5" fill="#EAFBF3">pessoas na fila</text>
  <text x="36" y="192" font-size="40" font-weight="800" fill="#FFFFFF">8</text>

  <g filter="url(#shA)"><rect x="196" y="120" width="164" height="84" rx="20" fill="url(#heroA)"/></g>
  <text x="214" y="150" font-size="11.5" fill="#EAFBF3">tempo de espera</text>
  <text x="212" y="190" font-size="32" font-weight="800" fill="#FFFFFF">35<tspan font-size="15" font-weight="600"> min</tspan></text>

  <!-- ALMOCO compacto (1 linha, tamanho do B) - fundo amarelo, ✎ na borda oposta -->
  <rect x="20" y="220" width="340" height="40" rx="12" fill="#FFF3D6" stroke="#FFE3A3"/>
  <text x="36" y="245" font-size="13" font-weight="600" fill="#8A5A00">🍽  Almoço previsto 12:00</text>
  <text x="342" y="246" font-size="15" text-anchor="end" fill="#8A5A00">✎</text>

  <!-- card de atendimento (branco, sombra) -->
  <g filter="url(#shA)"><rect x="20" y="276" width="340" height="84" rx="18" fill="#FFFFFF"/></g>
  <text x="38" y="306" font-size="15" font-weight="600" fill="#111827">João Pereira</text>
  <rect x="232" y="290" width="112" height="22" rx="11" fill="#E6F7F0"/>
  <text x="288" y="305" font-size="10.5" font-weight="600" fill="#067A57" text-anchor="middle">ATENDENDO · 06:12</text>
  <text x="38" y="330" font-size="12.5" fill="#6B7280">Corte + Barba · R$ 65</text>
  <text x="38" y="348" font-size="11.5" fill="#9CA3AF">Próximo: Marina · Escova</text>

  <!-- botao pilula verde -->
  <g filter="url(#shA)"><rect x="20" y="382" width="340" height="52" rx="26" fill="#00B37E"/></g>
  <text x="190" y="414" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Chamar próximo</text>

  <text x="20" y="476" font-size="11.5" fill="#6B7280">Cabeçalho clean (VUPTH + Minha fila, ✂ tipo, ★ avaliação no canto).</text>
  <text x="20" y="494" font-size="11.5" fill="#6B7280">Almoço 1 linha (amarelo) + ✎ na borda oposta · 2 cards verdes (sem "~").</text>
</svg>
