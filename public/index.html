<!DOCTYPE html>
<!--
  Modelo do index.html da web (pagina unica). O Expo le ESTE arquivo no lugar do
  dele e preenche o idioma (web.lang do app.json) e o titulo. Ele troca so a
  PRIMEIRA ocorrencia de cada marcador: nao cite os marcadores neste comentario.

  Por que existe (Andre, 25/09): o navegador decide oferecer traducao ao ler a
  pagina, antes do app rodar. O pedido de "nao traduzir" feito no boot
  (src/lib/naoTraduzir.ts) chegava tarde. Aqui ele vai no HTML entregue.
  Guardado por src/lib/__tests__/webConfig.test.ts.
-->
<html lang="%LANG_ISO_CODE%" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="google" content="notranslate" />
    <title>%WEB_TITLE%</title>
    <!-- O reset recomendado do react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Ative o JavaScript para usar o app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
