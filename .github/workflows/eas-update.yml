name: EAS Update (OTA)

# Publica a camada JavaScript (telas/logica/fixes) pela internet, sem rebuild de loja.
# push em dev  -> branch/canal "preview"    (testers, APK preview)
# push em main -> branch/canal "production"  (usuarios finais)
# Nao atualiza camada nativa: lib nativa nova / permissao / icone / bump de SDK
# exigem um novo build (o runtimeVersion muda e o update deixa de casar).

on:
  push:
    branches: [dev, main]
    # Doc/spec/E2E-yaml nao mudam o bundle JS — nao republica OTA (economia).
    paths-ignore:
      - "**.md"
      - "src/docs/**"
      - "design/**"
      - ".maestro/**"
      - ".gitignore"
      - "docs/**"
      - "LICENSE"

# Pushes em sequencia cancelam o OTA anterior da mesma branch — so publica o mais novo.
concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # A mensagem do commit vai por env var (nao interpolada direto no shell):
      # mensagens multi-linha / com aspas quebram o `--message "${{ ... }}"`.
      - name: Publish OTA (dev -> preview)
        if: github.ref == 'refs/heads/dev'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: eas update --branch preview --message "$MSG" --non-interactive

      - name: Publish OTA (main -> production)
        if: github.ref == 'refs/heads/main'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: eas update --branch production --message "$MSG" --non-interactive
