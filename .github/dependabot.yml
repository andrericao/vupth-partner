# PRs automaticos de atualizacao (melhoria de 02/10). Semanal, para nao virar
# ruido. Os PRs passam pelo mesmo CI (ci.yml) de qualquer outro.
#
# ⚠️ Expo, React Native e React sobem JUNTOS e com o Client e o Backend (acordo
# entre equipes, SDK por aparelho no Expo Go) — por isso ficam de fora das
# atualizacoes de versao. Alerta de seguranca continua chegando para eles.
#
# ESLint so sobe de major junto com o eslint-config-expo: o eslint-plugin-react
# que ele traz quebra no ESLint 10 (context.getFilename removido) — PR #58.
# TypeScript 7 (PR #56): ts-jest e typescript-eslint ainda nao rodam nele.
# Testing Library 14 (PR #57): render virou assincrono — migrar todas as suites.
# jest-expo, jest e @types/jest sobem de major com o SDK do Expo: o jest-expo 57
# e do SDK 57 (PR #62: react-test-renderer 19.2 contra o React 19.1) e o
# expo-doctor recusa jest/@types/jest fora do par do SDK (PR #63).
# Triagem de 04/10 (DEC-20): tailwindcss 4 (PR #68) nao roda no NativeWind 4,
# que e do tailwind 3 — o CI passa porque o jest nao compila o CSS; o build
# quebraria. @babel/core 8 (PR #69) quebra o babel-preset-expo do SDK 54 (CI
# vermelho, todas as suites). Os dois sobem de major com o SDK/NativeWind.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: jest-expo
        update-types: ["version-update:semver-major"]
      - dependency-name: jest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
