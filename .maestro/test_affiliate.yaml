appId: host.exp.exponent
---
# Teste isolado de vinculação de profissional
# Usa establishments já criados pelo seed (TAG: 97616)
# Rodar: maestro test .maestro/test_affiliate.yaml

# ============================================================
# PROFESSIONAL — afilia a Corte Real
# ============================================================

- evalScript: ${output.TAG = '97616'}
- evalScript: ${output.EST1 = 'Corte Real ' + output.TAG}
- evalScript: ${output.PE1 = 'proftest-' + Date.now() + '@test.dev'}
- evalScript: ${output.P5 = 'Ricardo ' + output.TAG}

# 1. Register
- assertVisible: "Como deseja usar o VUPTH?"
- tapOn: "Sou profissional"
- assertVisible: "Cadastrar"
- tapOn:
    id: "register-email"
- inputText: "${output.PE1}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "Senha@123"
- hideKeyboard
- tapOn: "Criar Conta"

# 2. Profile
- assertVisible: "Cadastro Profissional"
- tapOn:
    id: "professional-name"
- inputText: "${output.P5}"
- hideKeyboard
- tapOn: "Barbeiro"
- tapOn: "Continuar"

# 3. Search
- assertVisible: "Buscar Estabelecimento"
- tapOn:
    id: "search-establishment"
- inputText: "${output.EST1}"
- hideKeyboard
- tapOn: "Buscar"
- assertVisible: "${output.EST1}"

# 4. Select — tapa no card de resultado (BARBER abaixo do nome)
- tapOn:
    text: "BARBER"

# 5. Confirm
- assertVisible: "Confirmar Vinculacao"
- tapOn: "Confirmar e Afiliar"
- assertVisible: "Minha Fila"

# 6. Logout
- tapOn: "Sair"
- assertVisible: "Como deseja usar o VUPTH?"
