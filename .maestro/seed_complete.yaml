# Select and confirm — tapa no texto do service type (unico no card)
- tapOn: "BARBER"
- assertVisible: "Confirmar Vinculacao"
- tapOn: "Confirmar e Afiliar"
- assertVisible: "Minha Fila"

# Logout — profissional tem tabs, "Sair" esta na tab Perfil
