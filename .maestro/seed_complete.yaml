appId: host.exp.exponent
---
# VUPTH Partner — SEED COMPLETO para E2E
# Cria 4 establishments, 4 professionals (via owner), 2 professionals (self-register + affiliate).
# Nomes com sufixo unico por execucao (ultimos 5 digitos do timestamp).
# Rodar: maestro test .maestro/seed_complete.yaml

- evalScript: ${output.TAG = Date.now().toString().slice(-5)}

# ============================================================
# OWNER 1 — Barbearia (BARBER)
# ============================================================

- evalScript: ${output.EMAIL1 = 'barber-' + Date.now() + '@test.dev'}
- evalScript: ${output.EST1 = 'Corte Real ' + output.TAG}
- evalScript: ${output.P1 = 'Carlos ' + output.TAG}

- assertVisible: "Como deseja usar o VUPTH?"
- tapOn: "Sou dono de estabelecimento"
- assertVisible: "Cadastrar"
- tapOn:
    id: "register-email"
- inputText: "${output.EMAIL1}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "Senha@123"
- hideKeyboard
- tapOn: "Criar Conta"
- assertVisible: "Dados da Loja"

# Create Establishment
- tapOn: "Rei do Corte LTDA"
- inputText: "${output.EST1}"
- hideKeyboard
- tapOn: "Barbearia"
- tapOn: "Criar Estabelecimento"
- assertVisible: "${output.EST1}"

# Open
- tapOn: "Abrir Estabelecimento"
- assertVisible: "ABERTO"

# Professional 1: Carlos
- tapOn: "Adicionar Profissional"
- assertVisible: "Novo Profissional"
- tapOn: "Nome do profissional"
- inputText: "${output.P1}"
- hideKeyboard
- tapOn: "Adicionar Profissional"
- assertVisible: "Profissional criado"
- tapOn: "OK"
- assertVisible: "${output.EST1}"

# Service 1: Corte a maquina R$30 (default, no type tap needed)
- tapOn: "Adicionar Serviço"
- assertVisible: "Novo Serviço"
- tapOn:
    id: "service-custom-name"
- inputText: "Corte Degrade"
- hideKeyboard
- tapOn: "35.00"
- inputText: "30"
- hideKeyboard
- scrollUntilVisible:
    element: "Adicionar Serviço"
    direction: DOWN
- tapOn: "Adicionar Serviço"
- assertVisible: "Serviço adicionado"
- tapOn: "OK"
- assertVisible: "${output.EST1}"

# Service 2: Barba R$25
- tapOn: "Adicionar Serviço"
- assertVisible: "Novo Serviço"
- tapOn: "Barba"
- tapOn:
    id: "service-custom-name"
- eraseText: 30
- inputText: "Barba Completa"
- hideKeyboard
- tapOn: "35.00"
- inputText: "25"
- hideKeyboard
- scrollUntilVisible:
    element: "Adicionar Serviço"
    direction: DOWN
- tapOn: "Adicionar Serviço"
- assertVisible: "Serviço adicionado"
- tapOn: "OK"
- assertVisible: "${output.EST1}"

# Service 3: Corte Tesoura R$40
- tapOn: "Adicionar Serviço"
- assertVisible: "Novo Serviço"
- scrollUntilVisible:
    element: "Corte à tesoura"
    direction: DOWN
- tapOn: "Corte à tesoura"
- tapOn:
    id: "service-custom-name"
- eraseText: 30
- inputText: "Corte Tesoura Premium"
- hideKeyboard
- tapOn: "35.00"
- inputText: "40"
- hideKeyboard
- scrollUntilVisible:
    element: "Adicionar Serviço"
    direction: DOWN
- tapOn: "Adicionar Serviço"
- assertVisible: "Serviço adicionado"
- tapOn: "OK"

# Logout
- assertVisible: "${output.EST1}"
- scrollUntilVisible:
    element: "Sair"
    direction: DOWN
- tapOn: "Sair"
- assertVisible: "Como deseja usar o VUPTH?"

