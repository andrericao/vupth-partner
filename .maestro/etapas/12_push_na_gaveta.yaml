# push-na-bateria (Andre, 05/10; o formato do Client, avulsa 13): o push chega
# na gaveta do Android e o toque abre a tela certa. Aqui, o dono com o app
# FECHADO recebe "Pedido de vinculo" (AFFILIATION_REQUESTED, um profissional
# pede pela API) e o toque abre Solicitacoes com o pedido. Cobre o ✋
# pushes-de-vinculo do lado do dono. O launchApp do Maestro ja permite as
# notificacoes; o app registra o token ao entrar.
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_DONO}
    label: "12.01 · entra como o dono"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 30000
    label: "12.02 · espera ${output.LOJA} (o token do push ja foi registrado)"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "12.03 · roda fechar_aviso"
# S43 (Backend 657a119): da tempo ao POST /devices do token novo antes do push
- extendedWaitUntil:
    visible: "__nunca_aparece__"
    timeout: 10000
    optional: true
    label: "12.03a · espera 10 s o registro do token do push"
# Bateria 22:48 (e 20:08): o stopApp do Maestro e um force-stop, e o Android
# nao entrega FCM a app parado a forca — o push nunca chegava. Vai para a tela
# inicial: o app fica em segundo plano e o push cai na gaveta.
- pressKey:
    key: Home
    label: "12.04 · vai para a tela inicial (app em segundo plano)"
- runScript:
    file: ../scripts/vinculo_para_recusar.js
    env:
      EMAIL_DONO: ${output.EMAIL_DONO}
      TAG: ${output.TAG}
      QUEM: "Push"
    label: "12.05 · um profissional pede vinculo pela API"
- swipe:
    start: "50%, 0%"
    end: "50%, 80%"
    label: "12.06 · abre a gaveta de notificações"
- extendedWaitUntil:
    visible: "Pedido de vínculo"
    timeout: 90000
    label: "12.07 · espera o push Pedido de vínculo"
# notificacao-com-botao (PAR-11): toda notificacao tem botao. O pedido de
# vinculo vem com o OK (categoria CIENCIA); o print mostra a gaveta.
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: "12-push-com-botao"
      O_QUE: "a notificacao Pedido de vinculo mostra o botao OK"
    label: "12.07a · print da gaveta com o botao do push"
- tapOn:
    text: "Pedido de vínculo"
    label: "12.08 · toca no push"
- extendedWaitUntil:
    visible: "Solicitações"
    timeout: 60000
    label: "12.09 · abriu Solicitações"
- extendedWaitUntil:
    visible: ${output.PROF_PUSH}
    timeout: 20000
    label: "12.10 · o pedido de ${output.PROF_PUSH} está lá"
- runFlow:
    file: ../apoio/fechar_cortina.yaml
    label: "12.99 · confere a cortina fechada"
