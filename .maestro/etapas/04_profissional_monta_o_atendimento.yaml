# O profissional vinculado: Perfil sem o codigo da especialidade (QA 19.1),
# servico com tempo e preco (QA 18.3/18.4), refeicao e o interruptor do aviso
# (QA 19.5), e entra em Trabalhando — o que abre a loja.
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_PROF}
    label: "04.01 · roda entrar"
- extendedWaitUntil:
    visible:
      id: "aba-perfil"
    timeout: 30000
    label: "04.02 · espera aba-perfil"

# Perfil: so o nome da loja, sem "NAIL_TECH"
- tapOn:
    id: "aba-perfil"
    label: "04.03 · toca em aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "04.04 · roda fechar_aviso"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 20000
    label: "04.05 · espera ${output.LOJA}"
- assertNotVisible:
    text: ".*NAIL_TECH.*"
    label: "04.06 · confere que nao tem …NAIL_TECH…"

# Servico: 45 min, R$ 30,00, depois editado para 60 min
- tapOn:
    text: "Meus serviços"
    label: "04.07 · toca em Meus serviços"
- tapOn:
    text: "Adicionar serviço"
    label: "04.08 · toca em Adicionar serviço"
- tapOn:
    id: "service-name"
    label: "04.09 · toca em service-name"
- eraseText:
    charactersToErase: 40
    label: "04.10 · apaga 40"
- inputText:
    text: "Manicure ${output.TAG}"
    label: "04.11 · digita Manicure ${output.TAG}"
- tapOn:
    id: "service-minutes"
    label: "04.12 · toca em service-minutes"
- eraseText:
    charactersToErase: 5
    label: "04.13 · apaga 5"
- inputText:
    text: "45"
    label: "04.14 · digita 45"
- tapOn:
    id: "service-price"
    label: "04.15 · toca em service-price"
- inputText:
    text: "3000"
    label: "04.16 · digita 3000"
- hideKeyboard:
    label: "04.17 · fecha o teclado"
- scrollUntilVisible:
    element: "Adicionar serviço"
    direction: DOWN
    label: "04.18 · rola ate Adicionar serviço"
- tapOn:
    text: "Adicionar serviço"
    label: "04.19 · toca em Adicionar serviço"
# O 1o servico fecha o cadastro: chegam DOIS avisos, um depois do outro —
# "Servico adicionado" e, quando o perfil volta (useAnuncioPronto), "Cadastro
# completo". Cada um cobre a lista e o Maestro deixa de ver o "45min" embaixo
# (rodadas de 03/10: fechava so o 1o; bateria-04-popup-loja). Fecha os dois.
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "04.20 · roda fechar_aviso (Servico adicionado)"
- extendedWaitUntil:
    visible: "Cadastro completo"
    timeout: 15000
    optional: true
    label: "04.21 · espera Cadastro completo"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "04.21a · roda fechar_aviso (Cadastro completo)"
- extendedWaitUntil:
    visible: ".*45min.*"
    timeout: 20000
    label: "04.22 · espera …45min…"
- tapOn:
    text: "Editar"
    label: "04.23 · toca em Editar"
- tapOn:
    id: "edit-service-minutes"
    label: "04.24 · toca em edit-service-minutes"
- eraseText:
    charactersToErase: 5
    label: "04.25 · apaga 5"
- inputText:
    text: "60"
    label: "04.26 · digita 60"
- hideKeyboard:
    label: "04.27 · fecha o teclado"
- scrollUntilVisible:
    element: "Salvar"
    direction: DOWN
    label: "04.28 · rola ate Salvar"
- tapOn:
    text: "Salvar"
    label: "04.29 · toca em Salvar"
- extendedWaitUntil:
    visible: ".*60min.*"
    timeout: 20000
    label: "04.30 · espera …60min…"

# Refeicao e o interruptor do aviso
- tapOn:
    id: "aba-perfil"
    label: "04.31 · toca em aba-perfil"
- tapOn:
    text: "Refeições"
    label: "04.32 · toca em Refeições"
- tapOn:
    text: "Adicionar refeição"
    label: "04.33 · toca em Adicionar refeição"
- tapOn:
    text: "Ex: Almoço"
    label: "04.34 · toca em Ex: Almoço"
- inputText:
    text: "Almoco"
    label: "04.35 · digita Almoco"
- tapOn:
    text: "12:00"
    label: "04.36 · toca em 12:00"
- inputText:
    text: "0400"
    label: "04.37 · digita 0400"
- tapOn:
    text: "60"
    label: "04.38 · toca em 60"
- inputText:
    text: "30"
    label: "04.39 · digita 30"
- hideKeyboard:
    label: "04.40 · fecha o teclado"
- tapOn:
    text: "Todos os dias"
    label: "04.41 · toca em Todos os dias"
- scrollUntilVisible:
    element: "Adicionar"
    direction: DOWN
    label: "04.42 · rola ate Adicionar"
- tapOn:
    text: "Adicionar"
    label: "04.43 · toca em Adicionar"
- extendedWaitUntil:
    visible: "Almoco"
    timeout: 20000
    label: "04.44 · espera Almoco"
- scrollUntilVisible:
    element:
      id: "interruptor-aviso-refeicao"
    direction: DOWN
    label: "04.45 · rola ate interruptor-aviso-refeicao"
- tapOn:
    id: "interruptor-aviso-refeicao"
    label: "04.46 · toca em interruptor-aviso-refeicao"
- assertVisible:
    text: "Desligado.*"
    label: "04.47 · confere Desligado…"
- tapOn:
    id: "interruptor-aviso-refeicao"
    label: "04.48 · toca em interruptor-aviso-refeicao"
- assertVisible:
    text: "Ligado.*"
    label: "04.49 · confere Ligado…"

# Trabalhando: a loja abre com a chegada do primeiro profissional
- runFlow:
    file: ../apoio/status.yaml
    env:
      STATUS: trabalhando
    label: "04.50 · roda status"
- assertVisible:
    text: "Você está: Trabalhando.*"
    label: "04.51 · confere Você está: Trabalhando…"
