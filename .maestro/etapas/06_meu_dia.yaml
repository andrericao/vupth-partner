# Relatorios do profissional: o liquido ("Você recebeu", QA 18.3), o historico
# de HOJE (QA 19.3) com Finalizado e Retirado, e o filtro Retirados (QA 16.5).
appId: ${APP_ID}
---
- tapOn:
    id: "aba-relatorios"
    label: "06.01 · toca em aba-relatorios"
- extendedWaitUntil:
    visible: "Seu dia"
    timeout: 20000
    label: "06.02 · espera Seu dia"
- extendedWaitUntil:
    visible: "Você recebeu"
    timeout: 20000
    label: "06.03 · espera Você recebeu"
# relatorio-todas-as-linhas (DEC-55): o topo traz a conta do periodo, linha a linha.
# relatorios-com-dropdown (22/10): a conta do periodo vem recolhida; o toque abre.
- scrollUntilVisible:
    element:
      id: "conta-do-periodo-secao-titulo"
    direction: DOWN
    label: "06.03a · conta · o dropdown A conta do periodo aparece"
- tapOn:
    id: "conta-do-periodo-secao-titulo"
    label: "06.03a1 · conta · abre o dropdown"
- scrollUntilVisible:
    element:
      id: "conta-do-periodo"
    direction: DOWN
    label: "06.03a2 · conta · a conta do periodo aparece aberta"
- assertVisible:
    text: "Arredondamento"
    label: "06.03b · conta · com todas as linhas"
# relatorio-sem-multa (PAR, DEC-83, Backend 0112396): o CLIENTE2 saiu pela loja
# (05.22, Remover), entao o resumo traz "Nao realizados" com o motivo, sem valor
# de multa.
- scrollUntilVisible:
    element: "Não realizados"
    direction: DOWN
    label: "06.03c · nao-realizados · o resumo traz Não realizados"
- tapOn:
    id: "nao-realizados-por-motivo-titulo"
    label: "06.03c1 · nao-realizados · abre o dropdown"
- assertVisible:
    text: "Profissional removeu o cliente"
    label: "06.03d · nao-realizados · com o motivo (a loja removeu o cliente)"
- scrollUntilVisible:
    element: ${output.CLIENTE1}
    direction: DOWN
    label: "06.04 · rola ate ${output.CLIENTE1}"
- assertVisible:
    text: "Finalizado"
    label: "06.05 · confere Finalizado"
# explicar-o-relatorio (PAR-18): o toque no atendimento abre a conta.
- tapOn:
    text: ${output.CLIENTE1}
    label: "06.05a · conta · toca no atendimento de ${output.CLIENTE1}"
- scrollUntilVisible:
    element:
      id: "composicao-do-atendimento"
    direction: DOWN
    label: "06.05b · conta · rola ate a conta do atendimento"
- assertVisible:
    text: "Você recebe"
    label: "06.05c · conta · mostra a parte do profissional"
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: "06-conta-do-atendimento"
      O_QUE: "a conta do atendimento: Cliente pagou, Voce recebe, Empresa de pagamento, App Vupth"
    label: "06.05d · print da conta do atendimento"
- scrollUntilVisible:
    element: "Retirados"
    direction: UP
    label: "06.06 · rola ate Retirados"
- tapOn:
    text: "Retirados"
    label: "06.07 · toca em Retirados"
- scrollUntilVisible:
    element: ${output.CLIENTE2}
    direction: DOWN
    label: "06.08 · rola ate ${output.CLIENTE2}"
- assertVisible:
    text: "Retirado"
    label: "06.09 · confere Retirado"
- tapOn:
    id: "nao-realizados-por-motivo-titulo"
    label: "06.03c1 · nao-realizados · abre o dropdown"
- assertVisible:
    text: "Profissional removeu o cliente"
    label: "06.09a · nao-realizados · o atendimento retirado diz o motivo"
- scrollUntilVisible:
    element:
      id: "quanto-cobrar-card"
    direction: UP
    label: "06.10 · aba-de-custos · rola ate o cartao Quanto cobrar?"
- tapOn:
    id: "quanto-cobrar-card"
    label: "06.10a · aba-de-custos · abre a calculadora"
- assertVisible:
    text: "Preencha o que você gasta. O app faz a conta."
    label: "06.10b · aba-de-custos · mostra os campos"
- assertVisible:
    id: "custos-calcular"
    label: "06.10c · aba-de-custos · o botao Calcular"
- back
