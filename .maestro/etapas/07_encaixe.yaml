# Fora: a fila fecha e a loja fecha junto. Um cliente pede encaixe pela API e o
# profissional RECUSA (fluxo critico, DEC-7); outro pede, o profissional aceita
# e passa a Trabalhando (QA 19.2). Depois atende e sai.
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/status.yaml
    env:
      STATUS: indisponivel
    label: "07.01 · roda status"
- assertVisible:
    text: "Você está: Fora.*"
    label: "07.02 · confere Você está: Fora…"
- runScript:
    file: ../scripts/pedido_de_encaixe.js
    env:
      EMAIL_PROF: ${output.EMAIL_PROF}
      TAG: ${output.TAG}
      QUEM: Recusado
    label: "07.03 · script pedido_de_encaixe (o que sera recusado)"
- tapOn:
    id: "aba-encaixes"
    label: "07.04 · toca em aba-encaixes"
- extendedWaitUntil:
    visible: ".*${output.CLIENTE_RECUSADO}.*"
    timeout: 60000
    label: "07.05 · espera …${output.CLIENTE_RECUSADO}…"
# corte-com-horario (S26): o pedido sem horario diz "assim que abrir"
- assertVisible:
    id: "encaixe-quando"
    text: "Quer assim que abrir"
    label: "07.05a · confere Quer assim que abrir"
- tapOn:
    text: "Recusar"
    label: "07.06 · toca em Recusar"
- extendedWaitUntil:
    notVisible: ".*${output.CLIENTE_RECUSADO}.*"
    timeout: 20000
    label: "07.07 · espera o pedido sumir"
- assertVisible:
    text: "Nenhum pedido de encaixe"
    label: "07.08 · confere a lista vazia"
- runScript:
    file: ../scripts/pedido_de_encaixe.js
    env:
      EMAIL_PROF: ${output.EMAIL_PROF}
      TAG: ${output.TAG}
    label: "07.09 · script pedido_de_encaixe (o que sera aceito)"
- extendedWaitUntil:
    visible: ".*${output.CLIENTE_ENCAIXE}.*"
    timeout: 60000
    label: "07.10 · espera …${output.CLIENTE_ENCAIXE}…"
- tapOn:
    text: "Aceitar"
    label: "07.11 · toca em Aceitar"
- tapOn:
    id: "aba-fila"
    label: "07.12 · toca em aba-fila"
- extendedWaitUntil:
    visible: "Você está: Trabalhando.*"
    timeout: 20000
    label: "07.13 · espera Você está: Trabalhando…"
- extendedWaitUntil:
    visible: ${output.CLIENTE_ENCAIXE}
    timeout: 30000
    label: "07.14 · espera ${output.CLIENTE_ENCAIXE}"
- tapOn:
    text: "Iniciar próximo"
    label: "07.15 · toca em Iniciar próximo"
- extendedWaitUntil:
    visible: "Finalizar"
    timeout: 20000
    label: "07.16 · espera Finalizar"
- tapOn:
    text: "Finalizar"
    label: "07.17 · toca em Finalizar"
- extendedWaitUntil:
    notVisible: ${output.CLIENTE_ENCAIXE}
    timeout: 20000
    label: "07.18 · espera"
- runFlow:
    file: ../apoio/status.yaml
    env:
      STATUS: indisponivel
    label: "07.19 · roda status"

# expediente-no-card (b6dad1b; precisa do ece217a do Backend no staging): o
# profissional trabalhou e foi para Fora — Hoje mostra a faixa HH:MM–HH:MM.
- tapOn:
    id: "aba-relatorios"
    label: "07.20 · expediente-no-card · toca em aba-relatorios"
- extendedWaitUntil:
    visible: "Seu dia"
    timeout: 20000
    label: "07.21 · expediente-no-card · espera Seu dia"
- scrollUntilVisible:
    element: "\\d\\d:\\d\\d–\\d\\d:\\d\\d"
    direction: DOWN
    timeout: 20000
    label: "07.22 · expediente-no-card · rola ate HH:MM–HH:MM"

# foto-com-botao-claro (8b89b1a): a foto do perfil tem "Pôr foto"/"Editar foto"
# e abre a folha Tirar foto · Escolher da galeria · Cancelar. A camera e a
# galeria de verdade ficam so a mao.
- tapOn:
    id: "aba-perfil"
    label: "07.23 · foto-com-botao-claro · toca em aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "07.24 · roda fechar_aviso"
- tapOn:
    text: "Dados cadastrais"
    label: "07.25 · foto-com-botao-claro · toca em Dados cadastrais"
- tapOn:
    id: "foto-perfil-editar"
    label: "07.26 · foto-com-botao-claro · toca em Pôr foto"
- extendedWaitUntil:
    visible:
      id: "foto-perfil-camera"
    timeout: 10000
    label: "07.27 · foto-com-botao-claro · espera Tirar foto"
- assertVisible:
    id: "foto-perfil-galeria"
    label: "07.28 · foto-com-botao-claro · confere Escolher da galeria"
- tapOn:
    text: "Cancelar"
    label: "07.29 · foto-com-botao-claro · toca em Cancelar"
- extendedWaitUntil:
    notVisible:
      id: "foto-perfil-camera"
    timeout: 10000
    label: "07.30 · foto-com-botao-claro · a folha fechou"
# foto-pela-bateria (Andre, 03/10): grava a foto de verdade, pela galeria
- runFlow:
    file: ../apoio/escolher_foto.yaml
    env:
      QUAL: "foto-perfil"
    label: "07.44 · foto-pela-bateria · grava a foto do perfil pela galeria"

# aparencia (7834bec): Perfil → Aparência → fonte +2 → Salvar continua na mesma
# tela e mostra +2; volta para Normal no fim (a rodada nao deixa sujeira).
- tapOn:
    id: "aba-perfil"
    label: "07.31 · aparencia · toca em aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "07.32 · roda fechar_aviso"
- scrollUntilVisible:
    element: "Aparência"
    direction: DOWN
    label: "07.33 · aparencia · rola ate Aparência"
- tapOn:
    text: "Aparência"
    label: "07.34 · aparencia · toca em Aparência"
- tapOn:
    id: "aparencia-fonte"
    label: "07.35 · aparencia · toca em Tamanho da fonte"
- tapOn:
    id: "fonte-2"
    label: "07.36 · aparencia · escolhe +2"
- tapOn:
    id: "salvar-fonte"
    label: "07.37 · aparencia · toca em Salvar"
- extendedWaitUntil:
    visible: "Tema e tamanho da fonte."
    timeout: 20000
    label: "07.38 · aparencia · continua na tela Aparência"
- assertVisible:
    text: "+2"
    label: "07.39 · aparencia · confere +2"
- tapOn:
    id: "aparencia-fonte"
    label: "07.40 · aparencia · toca em Tamanho da fonte"
- tapOn:
    id: "fonte-0"
    label: "07.41 · aparencia · escolhe Normal"
- tapOn:
    id: "salvar-fonte"
    label: "07.42 · aparencia · toca em Salvar"
- extendedWaitUntil:
    visible: "Normal"
    timeout: 20000
    label: "07.43 · aparencia · confere Normal"

- runFlow:
    file: ../apoio/sair_profissional.yaml
    label: "07.44 · roda sair_profissional"
