# O profissional abre a propria loja pelo Perfil (abrir-meu-estabelecimento,
# que era so a mao): cria a loja nova e escolhe atender nela — a role OWNER se
# soma a PROFESSIONAL e o Vinculo passa a mostrar a loja nova. Conta propria
# (EMAIL_ABRE), vinculada a loja do dono, para aparecer "Onde voce vai atender?".
appId: ${APP_ID}
---
- runFlow:
    file: ../conjunta/prof_abrir_loja.yaml
    env:
      DONO: "Dono Abre${output.TAG}"
      LOJA_NOVA: "Loja N${output.TAG}"
      ESCOLHA: nova
    label: "11.01 · roda prof_abrir_loja (atender na loja nova)"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "11.01a · fecha a caixa do push, se vier (bateria 20:08)"
# Bateria 22:48: com a loja nova, a conta e dono + profissional e o app abre na
# visao de dono (Inicio, Filas, Menu) — troca pelo Menu, igual ao prof_entrar.
- extendedWaitUntil:
    visible:
      id: "(aba-perfil|aba-menu)"
    timeout: 30000
    label: "11.01b0 · espera o Perfil ou o Menu do dono"
- runFlow:
    when:
      notVisible:
        id: "aba-perfil"
    commands:
      - tapOn:
          id: "aba-menu"
      - tapOn: "Atender como profissional"
    label: "11.01b1 · na visao de dono, troca para a de profissional"
- extendedWaitUntil:
    visible:
      id: "aba-perfil"
    timeout: 30000
    label: "11.01b · espera a area do profissional (aba-perfil)"
- tapOn:
    id: "aba-perfil"
    label: "11.02 · toca em aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "11.03 · fecha o aviso, se houver"
# Emulador (log 2026-10-11_081612, 11.04): o "Vínculo" fica abaixo da tela.
- scrollUntilVisible:
    element: "Vínculo"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Vínculo"
    label: "11.04 · toca em Vinculo"
- extendedWaitUntil:
    visible: "Loja N${output.TAG}"
    timeout: 20000
    label: "11.05 · espera Loja N${output.TAG}"
- back:
    label: "11.06 · volta para o Perfil"
- runFlow:
    file: ../apoio/sair_profissional.yaml
    label: "11.07 · sai da conta"
