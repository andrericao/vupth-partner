# O dono confere: Filas, Relatorios com o recebido por profissional (QA 18.3),
# Atendimentos com o filtro Retirados, e a tela Sistema.
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_DONO}
    label: "08.01 · roda entrar"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 30000
    label: "08.02 · espera ${output.LOJA}"
# compartilhar-no-topo (05/10): o icone no canto direito do cabecalho do Inicio.
- assertVisible:
    id: "compartilhar-no-topo"
    label: "08.02a · confere compartilhar-no-topo"
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: inicio-compartilhar
      O_QUE: "o icone de compartilhar ao lado da pilula Aberta/Fechada, no topo do Inicio do dono"
    label: "08.02b · print para o Andre (inicio-compartilhar)"
- tapOn:
    id: "aba-filas"
    label: "08.03 · toca em aba-filas"
- extendedWaitUntil:
    visible: ${output.PROF}
    timeout: 20000
    label: "08.04 · espera ${output.PROF}"
# maestro-maximo (2a fatia): a fila do profissional pelo olhar do dono
# O toque no nome so abre/fecha o card (queues.tsx); a fila e o "Ver fila
# detalhada" do card aberto (bateria 20:08: o card abriu e a fila nao).
- runFlow:
    when:
      notVisible: "Ver fila detalhada"
    commands:
      - tapOn:
          text: ${output.PROF}
    label: "08.25 · abre o card de ${output.PROF}"
- tapOn:
    text: "Ver fila detalhada"
    label: "08.25a · toca em Ver fila detalhada"
- extendedWaitUntil:
    # o atualizar-fila-dono so existe na web (bateria 22:48): no Android, o
    # cartao "Espera total" e o que so a fila do profissional tem
    visible: "Espera total"
    timeout: 20000
    label: "08.26 · espera a fila do profissional"
- scrollUntilVisible:
    element: "Desvincular profissional"
    direction: DOWN
    label: "08.27 · confere Desvincular profissional (sem tocar)"
- back:
    label: "08.28 · volta para Filas"

- tapOn:
    id: "aba-menu"
    label: "08.05 · toca em aba-menu"
- tapOn:
    text: "Relatórios"
    label: "08.06 · toca em Relatórios"
- scrollUntilVisible:
    element: "recebe R\\$.*"
    direction: DOWN
    label: "08.07 · rola ate recebe R$…"

- tapOn:
    id: "aba-menu"
    label: "08.08 · toca em aba-menu"
- tapOn:
    text: "Atendimentos"
    label: "08.09 · toca em Atendimentos"
- tapOn:
    text: "Retirados"
    label: "08.10 · toca em Retirados"
- extendedWaitUntil:
    visible: ${output.CLIENTE2}
    timeout: 20000
    label: "08.11 · espera ${output.CLIENTE2}"
# pagamento-pix, fatia 4 (contrato 2a2b0ec): o pagamento ao lado do status, e o
# dono tambem marca "Recebi". O preparo da 08 finaliza o CLIENTE1 sem pagar.
- tapOn:
    text: "Finalizados"
    label: "08.11a · pix · toca em Finalizados"
- extendedWaitUntil:
    visible: ${output.CLIENTE1}
    timeout: 20000
    label: "08.11b · pix · espera ${output.CLIENTE1}"
- assertVisible:
    text: "Pagamento: aguardando pagamento"
    label: "08.11c · pix · confere aguardando pagamento"
- tapOn:
    text: "Recebi"
    label: "08.11d · pix · o dono toca em Recebi"
- tapOn:
    text: "Sim, recebi"
    label: "08.11e · pix · confirma"
- runFlow:
    file: ../apoio/pular_forma.yaml
    label: "08.11e1 · forma · pula Como recebeu?"
- extendedWaitUntil:
    visible: "Pagamento: pago"
    timeout: 20000
    label: "08.11f · pix · fica pago"

- tapOn:
    id: "aba-menu"
    label: "08.12 · toca em aba-menu"
- scrollUntilVisible:
    element: "Versão do app"
    direction: DOWN
    label: "08.13 · rola ate Versão do app"
- tapOn:
    text: "Versão do app"
    label: "08.14 · toca em Versão do app"
- extendedWaitUntil:
    visible:
      id: "version-line"
    timeout: 20000
    label: "08.15 · espera version-line"
# abas-do-dono (Andre, 10/10; achado da bateria 10:11): a tela Sistema do dono
# abre com as abas DELE (aba-menu), nao com as do profissional (aba-fila).
- assertVisible:
    id: "aba-menu"
    label: "08.15c · abas-do-dono · Sistema com a aba Menu"
- assertNotVisible:
    id: "aba-fila"
    label: "08.15d · abas-do-dono · sem a aba Fila do profissional"
- back:
    label: "08.15a · volta da tela Sistema"
- extendedWaitUntil:
    visible:
      id: "aba-menu"
    timeout: 20000
    label: "08.15b · espera aba-menu"
# botao-suporte (PAR-7): o Menu do dono tem o Suporte, abaixo da Versao do app.
- scrollUntilVisible:
    element: "Suporte"
    direction: DOWN
    label: "08.15s · suporte · rola ate Suporte"
- assertVisible:
    text: "dúvidas e passo a passo do app"
    label: "08.15t · suporte · o botao Suporte esta no Menu do dono"
# pix-nas-configuracoes (DEC-65): o dono cadastra a chave dele, a alternativa.
- scrollUntilVisible:
    element: "Chave Pix (alternativa)"
    direction: UP
    label: "08.15u · pix-do-dono · rola ate Chave Pix (alternativa)"
- tapOn:
    text: "Chave Pix (alternativa)"
    label: "08.15v · pix-do-dono · toca em Chave Pix (alternativa)"
- extendedWaitUntil:
    visible: "Vale quando o profissional que atendeu não tem chave. Cada profissional cadastra a dele."
    timeout: 20000
    label: "08.15w · pix-do-dono · abriu a tela da chave alternativa"
- assertVisible:
    id: "aba-menu"
    label: "08.15x · pix-do-dono · com as abas do dono"
- back:
    label: "08.15y · pix-do-dono · volta ao Menu"
- extendedWaitUntil:
    visible:
      id: "aba-menu"
    timeout: 20000
    label: "08.15z · pix-do-dono · espera aba-menu"
# abas-do-dono: a Aparencia do dono tambem
- scrollUntilVisible:
    element: "Aparência"
    direction: DOWN
    label: "08.15e · abas-do-dono · rola ate Aparência"
- tapOn:
    text: "Aparência"
    label: "08.15f · abas-do-dono · toca em Aparência"
- extendedWaitUntil:
    visible: "Tamanho da fonte"
    timeout: 20000
    label: "08.15g · abas-do-dono · espera a tela Aparência"
- assertVisible:
    id: "aba-menu"
    label: "08.15h · abas-do-dono · Aparência com a aba Menu"
- assertNotVisible:
    id: "aba-fila"
    label: "08.15i · abas-do-dono · sem a aba Fila do profissional"
- back:
    label: "08.15j · volta da Aparência"
- extendedWaitUntil:
    visible:
      id: "aba-menu"
    timeout: 20000
    label: "08.15k · espera aba-menu"

# foto-com-botao-claro / foto-da-loja (8b89b1a, fb2b267): a foto da loja abre a
# folha Tirar foto · Escolher da galeria · Cancelar. Enviar de verdade (camera,
# galeria) e ver no Client ficam so a mao.
