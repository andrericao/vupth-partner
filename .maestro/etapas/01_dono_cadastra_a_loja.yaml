# O dono cria a conta, a loja (Barbearia) e o horario: 24 horas nos 7 dias,
# para a loja poder abrir a qualquer hora em que a bateria rodar.
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/cadastrar.yaml
    env:
      PAPEL: owner
      EMAIL: ${output.EMAIL_DONO}
    label: "01.01 · roda cadastrar"
- extendedWaitUntil:
    visible: "Dados da loja"
    timeout: 30000
    label: "01.02 · espera Dados da loja"
- tapOn:
    text: "Ex: João Silva"
    label: "01.03 · toca em Ex: João Silva"
- inputText:
    text: "Dono ${output.TAG}"
    label: "01.04 · digita Dono ${output.TAG}"
- tapOn:
    text: "Rei do Corte LTDA"
    label: "01.05 · toca em Rei do Corte LTDA"
- inputText:
    text: ${output.LOJA}
    label: "01.06 · digita ${output.LOJA}"
- hideKeyboard:
    label: "01.07 · fecha o teclado"
- tapOn:
    text: "Barbearia"
    label: "01.08 · toca em Barbearia"
- tapOn:
    text: "Criar estabelecimento"
    label: "01.09 · toca em Criar estabelecimento"
- extendedWaitUntil:
    visible: "Você também vai atender?"
    timeout: 20000
    label: "01.10 · espera Você também vai atender?"
- scrollUntilVisible:
    element: "Não, apenas proprietário"
    direction: DOWN
    label: "01.11 · rola ate Não, apenas proprietário"
- tapOn:
    text: "Não, apenas proprietário"
    label: "01.12 · toca em Não, apenas proprietário"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 20000
    label: "01.13 · espera ${output.LOJA}"

# Horario: segunda 00:00-00:00 (= 24 horas) e o mesmo nos outros dias.
- tapOn:
    id: "aba-menu"
    label: "01.14 · toca em aba-menu"
- tapOn:
    text: "Dados do estabelecimento"
    label: "01.15 · toca em Dados do estabelecimento"
- tapOn:
    text: "Horário de Funcionamento"
    label: "01.16 · toca em Horário de Funcionamento"
- extendedWaitUntil:
    visible: "Semana"
    timeout: 20000
    label: "01.17 · espera Semana"
- tapOn:
    text: "Segunda abre"
    label: "01.18 · toca em Segunda abre"
- inputText:
    text: "0000"
    label: "01.19 · digita 0000"
- tapOn:
    text: "Segunda fecha"
    label: "01.20 · toca em Segunda fecha"
- inputText:
    text: "0000"
    label: "01.21 · digita 0000"
- hideKeyboard:
    label: "01.22 · fecha o teclado"
- scrollUntilVisible:
    element: "Usar o horário de segunda nos dias abertos"
    direction: DOWN
    label: "01.23 · rola ate Usar o horário de segunda nos dias abertos"
- tapOn:
    text: "Usar o horário de segunda nos dias abertos"
    label: "01.24 · toca em Usar o horário de segunda nos dias abertos"
- scrollUntilVisible:
    element: "Salvar semana"
    direction: DOWN
    label: "01.25 · rola ate Salvar semana"
- tapOn:
    text: "Salvar semana"
    label: "01.26 · toca em Salvar semana"
- extendedWaitUntil:
    visible: "Horário salvo"
    timeout: 20000
    label: "01.27 · espera Horário salvo"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "01.28 · roda fechar_aviso"
- scrollUntilVisible:
    element: "24 horas"
    direction: DOWN
    label: "01.29 · rola ate 24 horas"
- runFlow:
    file: ../apoio/sair_dono.yaml
    label: "01.30 · roda sair_dono"
