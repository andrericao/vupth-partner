# 07b (etapas-curtas, Andre 11/10): o perfil do profissional — foto com botao
# claro, a foto pela galeria e a Aparencia. A 07a (encaixe e expediente) vem antes.
appId: ${APP_ID}
---
# foto-com-botao-claro (8b89b1a): a foto do perfil tem "Pôr foto"/"Editar foto"
# e abre a folha Tirar foto · Escolher da galeria · Cancelar. A camera e a
# galeria de verdade ficam so a mao.
- tapOn:
    id: "aba-perfil"
    label: "07.23 · foto-com-botao-claro · toca em aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "07.24 · roda fechar_aviso"
# Log 2026-10-11_231425 (07.25): com a Chave Pix, "Dados cadastrais" fica
# abaixo da tela.
- scrollUntilVisible:
    element: "Dados cadastrais"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Dados cadastrais"
    label: "07.25 · foto-com-botao-claro · toca em Dados cadastrais"
- tapOn:
    id: "foto-perfil-editar"
    label: "07.26 · foto-com-botao-claro · toca em Pôr foto"
- extendedWaitUntil:
    visible:
      id: "foto-perfil-camera"
    timeout: 10000
    label: "07.27 · foto-com-botao-claro · espera Tirar foto"
- assertVisible:
    id: "foto-perfil-galeria"
    label: "07.28 · foto-com-botao-claro · confere Escolher da galeria"
- tapOn:
    text: "Cancelar"
    label: "07.29 · foto-com-botao-claro · toca em Cancelar"
- extendedWaitUntil:
    notVisible:
      id: "foto-perfil-camera"
    timeout: 10000
    label: "07.30 · foto-com-botao-claro · a folha fechou"
# foto-pela-bateria (Andre, 03/10): grava a foto de verdade, pela galeria
- runFlow:
    file: ../apoio/escolher_foto.yaml
    env:
      QUAL: "foto-perfil"
    label: "07.44 · foto-pela-bateria · grava a foto do perfil pela galeria"

# pagamento-pix, fatia 1 (contrato BAK 2a2b0ec): Perfil → Chave Pix → e-mail →
# Salvar → a chave aparece cadastrada.
- tapOn:
    id: "aba-perfil"
    label: "07.50 · pix · toca em aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "07.51 · roda fechar_aviso"
- scrollUntilVisible:
    element: "Chave Pix"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 30000
    label: "07.52 · pix · rola ate Chave Pix"
- tapOn:
    text: "Chave Pix"
    label: "07.53 · pix · toca em Chave Pix"
- tapOn:
    id: "pix-tipo-EMAIL"
    label: "07.54 · pix · escolhe E-mail"
- tapOn:
    id: "pix-chave"
    label: "07.55 · pix · toca na chave"
- inputText:
    text: "pix_m${output.TAG}@teste.com"
    label: "07.56 · pix · digita o e-mail"
- hideKeyboard
- tapOn:
    id: "pix-titular"
    label: "07.57 · pix · toca no titular"
- inputText:
    text: "Prof ${output.TAG}"
    label: "07.58 · pix · digita o titular"
- hideKeyboard
- tapOn:
    id: "pix-salvar"
    label: "07.59 · pix · toca em Salvar chave"
- extendedWaitUntil:
    visible: "E-mail · pix_m${output.TAG}@teste.com"
    timeout: 20000
    label: "07.60 · pix · a chave aparece cadastrada"
- back:
    label: "07.61 · pix · volta para o Perfil"
# conferencia-por-print (Andre, 10/10): agenda-do-profissional — Perfil → Minha
# agenda → Salvar semana. Prints antes e depois.
- runFlow:
    file: ../apoio/fechar_aviso.yaml
- scrollUntilVisible:
    element: "Minha agenda"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 30000
    label: "07.62 · agenda · rola ate Minha agenda"
- tapOn:
    text: "Minha agenda"
    label: "07.63 · agenda · toca em Minha agenda"
- extendedWaitUntil:
    visible: "Os dias e horários em que você atende.*"
    timeout: 20000
    label: "07.64 · agenda · confere o titulo"
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: 07.65_agenda-antes
      O_QUE: Minha agenda antes de salvar (agenda-do-profissional)
    label: "07.65 · agenda · print antes"
- scrollUntilVisible:
    element: "Salvar semana"
    direction: DOWN
    centerElement: true
    timeout: 30000
    label: "07.66 · agenda · rola ate Salvar semana"
- tapOn:
    text: "Salvar semana"
    label: "07.67 · agenda · toca em Salvar semana"
- extendedWaitUntil:
    visible: "(Horário salvo|.*caber no horário da loja.*)"
    timeout: 20000
    label: "07.68 · agenda · salvou (ou o aviso do horario da loja)"
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: 07.69_agenda-depois
      O_QUE: o aviso de agenda salva (agenda-do-profissional)
    label: "07.69 · agenda · print depois"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
- back:
    label: "07.70 · agenda · volta para o Perfil"

# aparencia (7834bec): Perfil → Aparência → fonte +2 → Salvar continua na mesma
# tela e mostra +2; volta para Normal no fim (a rodada nao deixa sujeira).
- tapOn:
    id: "aba-perfil"
    label: "07.31 · aparencia · toca em aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "07.32 · roda fechar_aviso"
- scrollUntilVisible:
    element: "Aparência"
    direction: DOWN
    label: "07.33 · aparencia · rola ate Aparência"
- tapOn:
    text: "Aparência"
    label: "07.34 · aparencia · toca em Aparência"
- tapOn:
    id: "aparencia-fonte"
    label: "07.35 · aparencia · toca em Tamanho da fonte"
- tapOn:
    id: "fonte-2"
    label: "07.36 · aparencia · escolhe +2"
- tapOn:
    id: "salvar-fonte"
    label: "07.37 · aparencia · toca em Salvar"
- extendedWaitUntil:
    visible: "Tema e tamanho da fonte."
    timeout: 20000
    label: "07.38 · aparencia · continua na tela Aparência"
- assertVisible:
    text: "+2"
    label: "07.39 · aparencia · confere +2"
- tapOn:
    id: "aparencia-fonte"
    label: "07.40 · aparencia · toca em Tamanho da fonte"
- tapOn:
    id: "fonte-0"
    label: "07.41 · aparencia · escolhe Normal"
- tapOn:
    id: "salvar-fonte"
    label: "07.42 · aparencia · toca em Salvar"
- extendedWaitUntil:
    visible: "Normal"
    timeout: 20000
    label: "07.43 · aparencia · confere Normal"

# botao-suporte (PAR-7): o Perfil tem o Suporte, no grupo Sistema. O toque abre
# o navegador (fora do app), entao a bateria so confere o botao.
- back:
    label: "07.43a · suporte · volta para o Perfil"
- scrollUntilVisible:
    element: "Suporte"
    direction: DOWN
    label: "07.43b · suporte · rola ate Suporte"
- assertVisible:
    text: "dúvidas e passo a passo do app"
    label: "07.43c · suporte · o botao Suporte esta no Perfil"
# cupom-no-app (DEC-61): "Promocoes" nasce desligado (CUPOM_NO_AR). Ao ligar,
# trocar este passo por tocar em Promocoes e usar um cupom de teste.
- assertNotVisible:
    text: "Promoções"
    label: "07.43d · cupom · Promoções ainda desligado"

- runFlow:
    file: ../apoio/sair_profissional.yaml
    label: "07.44 · roda sair_profissional"
