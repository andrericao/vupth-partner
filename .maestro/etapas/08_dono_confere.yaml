# O dono confere: Filas, Relatorios com o recebido por profissional (QA 18.3),
# Atendimentos com o filtro Retirados, e a tela Sistema.
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_DONO}
    label: "08.01 · roda entrar"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 30000
    label: "08.02 · espera ${output.LOJA}"
# compartilhar-no-topo (05/10): o icone no canto direito do cabecalho do Inicio.
- assertVisible:
    id: "compartilhar-no-topo"
    label: "08.02a · confere compartilhar-no-topo"
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: inicio-compartilhar
      O_QUE: "o icone de compartilhar ao lado da pilula Aberta/Fechada, no topo do Inicio do dono"
    label: "08.02b · print para o Andre (inicio-compartilhar)"
- tapOn:
    id: "aba-filas"
    label: "08.03 · toca em aba-filas"
- extendedWaitUntil:
    visible: ${output.PROF}
    timeout: 20000
    label: "08.04 · espera ${output.PROF}"
# maestro-maximo (2a fatia): a fila do profissional pelo olhar do dono
# O toque no nome so abre/fecha o card (queues.tsx); a fila e o "Ver fila
# detalhada" do card aberto (bateria 20:08: o card abriu e a fila nao).
- runFlow:
    when:
      notVisible: "Ver fila detalhada"
    commands:
      - tapOn:
          text: ${output.PROF}
    label: "08.25 · abre o card de ${output.PROF}"
- tapOn:
    text: "Ver fila detalhada"
    label: "08.25a · toca em Ver fila detalhada"
- extendedWaitUntil:
    # o atualizar-fila-dono so existe na web (bateria 22:48): no Android, o
    # cartao "Espera total" e o que so a fila do profissional tem
    visible: "Espera total"
    timeout: 20000
    label: "08.26 · espera a fila do profissional"
- scrollUntilVisible:
    element: "Desvincular profissional"
    direction: DOWN
    label: "08.27 · confere Desvincular profissional (sem tocar)"
- back:
    label: "08.28 · volta para Filas"

- tapOn:
    id: "aba-menu"
    label: "08.05 · toca em aba-menu"
- tapOn:
    text: "Relatórios"
    label: "08.06 · toca em Relatórios"
- scrollUntilVisible:
    element: "recebe R\\$.*"
    direction: DOWN
    label: "08.07 · rola ate recebe R$…"

- tapOn:
    id: "aba-menu"
    label: "08.08 · toca em aba-menu"
- tapOn:
    text: "Atendimentos"
    label: "08.09 · toca em Atendimentos"
- tapOn:
    text: "Retirados"
    label: "08.10 · toca em Retirados"
- extendedWaitUntil:
    visible: ${output.CLIENTE2}
    timeout: 20000
    label: "08.11 · espera ${output.CLIENTE2}"

- tapOn:
    id: "aba-menu"
    label: "08.12 · toca em aba-menu"
- scrollUntilVisible:
    element: "Versão do app"
    direction: DOWN
    label: "08.13 · rola ate Versão do app"
- tapOn:
    text: "Versão do app"
    label: "08.14 · toca em Versão do app"
- extendedWaitUntil:
    visible:
      id: "version-line"
    timeout: 20000
    label: "08.15 · espera version-line"

# foto-com-botao-claro / foto-da-loja (8b89b1a, fb2b267): a foto da loja abre a
# folha Tirar foto · Escolher da galeria · Cancelar. Enviar de verdade (camera,
# galeria) e ver no Client ficam so a mao.
- tapOn:
    id: "aba-menu"
    label: "08.16 · foto-da-loja · toca em aba-menu"
- scrollUntilVisible:
    element: "Dados do estabelecimento"
    direction: UP
    label: "08.17 · foto-da-loja · rola ate Dados do estabelecimento"
- tapOn:
    text: "Dados do estabelecimento"
    label: "08.18 · foto-da-loja · toca em Dados do estabelecimento"
- tapOn:
    id: "foto-loja-editar"
    label: "08.19 · foto-da-loja · toca em Pôr foto"
- extendedWaitUntil:
    visible:
      id: "foto-loja-camera"
    timeout: 10000
    label: "08.20 · foto-da-loja · espera Tirar foto"
- assertVisible:
    id: "foto-loja-galeria"
    label: "08.21 · foto-da-loja · confere Escolher da galeria"
- tapOn:
    text: "Cancelar"
    label: "08.22 · foto-da-loja · toca em Cancelar"
- extendedWaitUntil:
    notVisible:
      id: "foto-loja-camera"
    timeout: 10000
    label: "08.23 · foto-da-loja · a folha fechou"
- runFlow:
    file: ../apoio/escolher_foto.yaml
    env:
      QUAL: "foto-loja"
    label: "08.36 · foto-pela-bateria · grava a foto da loja pela galeria"

# maestro-maximo (2a fatia): Dados cadastrais e Endereco da loja (so olhar)
- tapOn:
    text: "Dados Cadastrais"
    label: "08.29 · toca em Dados Cadastrais"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 20000
    label: "08.30 · espera ${output.LOJA} nos dados cadastrais"
- back:
    label: "08.31 · volta para Dados do estabelecimento"
- tapOn:
    text: "Endereço"
    label: "08.32 · toca em Endereco"
- extendedWaitUntil:
    visible: "Endereço da loja"
    timeout: 20000
    label: "08.33 · espera Endereco da loja"
# ponto-da-loja-pelo-gps (05/10): com endereco salvo e o ponto ainda nao
# marcado pelo GPS, a tela pergunta ao abrir. A bateria nao muda o ponto.
- extendedWaitUntil:
    visible: "Ponto da loja no mapa"
    timeout: 5000
    optional: true
    label: "08.33a · espera a pergunta do ponto (se a loja tem endereco)"
- runFlow:
    when:
      visible: "Ponto da loja no mapa"
    commands:
      - tapOn:
          text: "Agora não"
    label: "08.33b · Agora não (o ponto fica como esta)"
- assertVisible:
    text: "(Usar minha localização|Localização registrada ✓)"
    label: "08.34 · confere o botao da localizacao"
- back:
    label: "08.35 · volta para Dados do estabelecimento"

- runFlow:
    file: ../apoio/sair_dono.yaml
    label: "08.24 · roda sair_dono"
