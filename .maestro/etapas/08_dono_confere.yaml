# O dono confere: Filas, Relatorios com o recebido por profissional (QA 18.3),
# Atendimentos com o filtro Retirados, e a tela Sistema.
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_DONO}
    label: "08.01 · roda entrar"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 30000
    label: "08.02 · espera ${output.LOJA}"
- tapOn:
    id: "aba-filas"
    label: "08.03 · toca em aba-filas"
- extendedWaitUntil:
    visible: ${output.PROF}
    timeout: 20000
    label: "08.04 · espera ${output.PROF}"

- tapOn:
    id: "aba-menu"
    label: "08.05 · toca em aba-menu"
- tapOn:
    text: "Relatórios"
    label: "08.06 · toca em Relatórios"
- scrollUntilVisible:
    element: "recebe R\\$.*"
    direction: DOWN
    label: "08.07 · rola ate recebe R$…"

- tapOn:
    id: "aba-menu"
    label: "08.08 · toca em aba-menu"
- tapOn:
    text: "Atendimentos"
    label: "08.09 · toca em Atendimentos"
- tapOn:
    text: "Retirados"
    label: "08.10 · toca em Retirados"
- extendedWaitUntil:
    visible: ${output.CLIENTE2}
    timeout: 20000
    label: "08.11 · espera ${output.CLIENTE2}"

- tapOn:
    id: "aba-menu"
    label: "08.12 · toca em aba-menu"
- scrollUntilVisible:
    element: "Versão do app"
    direction: DOWN
    label: "08.13 · rola ate Versão do app"
- tapOn:
    text: "Versão do app"
    label: "08.14 · toca em Versão do app"
- extendedWaitUntil:
    visible:
      id: "version-line"
    timeout: 20000
    label: "08.15 · espera version-line"

# foto-com-botao-claro / foto-da-loja (8b89b1a, fb2b267): a foto da loja abre a
# folha Tirar foto · Escolher da galeria · Cancelar. Enviar de verdade (camera,
# galeria) e ver no Client ficam so a mao.
- tapOn:
    id: "aba-menu"
    label: "08.16 · foto-da-loja · toca em aba-menu"
- scrollUntilVisible:
    element: "Dados do estabelecimento"
    direction: UP
    label: "08.17 · foto-da-loja · rola ate Dados do estabelecimento"
- tapOn:
    text: "Dados do estabelecimento"
    label: "08.18 · foto-da-loja · toca em Dados do estabelecimento"
- tapOn:
    id: "foto-loja-editar"
    label: "08.19 · foto-da-loja · toca em Pôr foto"
- extendedWaitUntil:
    visible:
      id: "foto-loja-camera"
    timeout: 10000
    label: "08.20 · foto-da-loja · espera Tirar foto"
- assertVisible:
    id: "foto-loja-galeria"
    label: "08.21 · foto-da-loja · confere Escolher da galeria"
- tapOn:
    text: "Cancelar"
    label: "08.22 · foto-da-loja · toca em Cancelar"
- extendedWaitUntil:
    notVisible:
      id: "foto-loja-camera"
    timeout: 10000
    label: "08.23 · foto-da-loja · a folha fechou"

- runFlow:
    file: ../apoio/sair_dono.yaml
    label: "08.24 · roda sair_dono"
