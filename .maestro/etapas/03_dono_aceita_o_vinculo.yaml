# O dono ve o numero da solicitacao (aba Menu, Profissionais, Ver
# solicitacoes) e aceita. QA 17.2. Depois recusa um segundo profissional e o
# convida pela busca (fluxos criticos, DEC-7).
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_DONO}
    label: "03.01 · roda entrar"
- extendedWaitUntil:
    visible: ${output.LOJA}
    timeout: 30000
    label: "03.02 · espera ${output.LOJA}"
- extendedWaitUntil:
    visible:
      id: "tab-badge-menu"
    timeout: 70000
    label: "03.03 · espera tab-badge-menu"
- tapOn:
    id: "aba-menu"
    label: "03.04 · toca em aba-menu"
- assertVisible:
    id: "menu-badge-profissionais"
    label: "03.05 · confere menu-badge-profissionais"
- tapOn:
    text: "Profissionais"
    label: "03.06 · toca em Profissionais"
- assertVisible:
    id: "path-requests-badge"
    label: "03.07 · confere path-requests-badge"
- tapOn:
    id: "path-requests"
    label: "03.08 · toca em path-requests"
- extendedWaitUntil:
    visible: ${output.PROF}
    timeout: 20000
    label: "03.09 · espera ${output.PROF}"
- tapOn:
    text: "Aceitar"
    label: "03.10 · toca em Aceitar"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "03.11 · roda fechar_aviso"
- tapOn:
    id: "aba-menu"
    label: "03.12 · toca em aba-menu"
- assertNotVisible:
    id: "menu-badge-profissionais"
    label: "03.13 · confere que nao tem menu-badge-profissionais"

# Fluxos criticos (DEC-7): um segundo profissional pede vinculo pela API; o
# dono RECUSA e depois o CONVIDA pela busca.
- runScript:
    file: ../scripts/vinculo_para_recusar.js
    env:
      EMAIL_DONO: ${output.EMAIL_DONO}
      TAG: ${output.TAG}
    label: "03.14 · script vinculo_para_recusar"
# O pedido novo chega como push com o app aberto e vira o dialogo "Pedido de
# vinculo" por cima do Menu (bateria 2026-10-05_073223). Espera ele, sem exigir.
- extendedWaitUntil:
    visible:
      id: "dialogo-botao-0"
    timeout: 10000
    optional: true
    label: "03.14a · espera o aviso Pedido de vinculo"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "03.14b · fecha o aviso Pedido de vinculo"
- tapOn:
    text: "Profissionais"
    label: "03.15 · toca em Profissionais"
- tapOn:
    id: "path-requests"
    label: "03.16 · toca em path-requests"
- extendedWaitUntil:
    visible: ${output.PROF_RECUSADO}
    timeout: 20000
    label: "03.17 · espera ${output.PROF_RECUSADO}"
- tapOn:
    text: "Rejeitar"
    label: "03.18 · toca em Rejeitar"
# Com ?status=ALL (historico-de-vinculo, 2a parte; BAK 7e3e21b) o recusado
# fica no Historico como "Rejeitado" (antes so vinham os PENDING).
- extendedWaitUntil:
    visible: "Rejeitado"
    timeout: 20000
    label: "03.19 · espera Rejeitado (historico)"
- assertNotVisible:
    text: "Rejeitar"
    label: "03.20 · confere que nao tem pendente"
- back:
    label: "03.21 · volta para Profissionais"
# Solicitacoes e aba escondida (href: null): o back pode cair no Menu em vez de
# Profissionais (rodada 2026-10-04_091005). Se caiu, entra de novo.
- runFlow:
    when:
      notVisible:
        id: "path-invite"
    label: "03.21a · se caiu no Menu, toca em Profissionais"
    commands:
      - tapOn:
          text: "Profissionais"
- tapOn:
    id: "path-invite"
    label: "03.22 · toca em Convidar um profissional"
- tapOn:
    text: "Nome do profissional"
    label: "03.23 · toca na busca"
- inputText:
    text: ${output.PROF_RECUSADO}
    label: "03.24 · digita ${output.PROF_RECUSADO}"
# Sem hideKeyboard: o Enter fecha o teclado (ver etapa 02).
- pressKey:
    key: Enter
    label: "03.25 · tecla Enter"
- extendedWaitUntil:
    visible: "Convidar"
    timeout: 20000
    label: "03.26 · espera o botao Convidar"
- tapOn:
    text: "Convidar"
    label: "03.27 · toca em Convidar"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "03.28 · fecha o aviso Convite enviado"
- extendedWaitUntil:
    visible: "Convite enviado"
    timeout: 20000
    label: "03.29 · espera Convite enviado"
- tapOn:
    id: "aba-menu"
    label: "03.30 · toca em aba-menu"
- runFlow:
    file: ../apoio/sair_dono.yaml
    label: "03.31 · roda sair_dono"
