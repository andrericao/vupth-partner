# 05b (etapas-curtas, Andre 11/10): Opcoes da fila (Intervalo, Fechar, Reabrir) e
# Mostrar a posicao. A 05a (atender, pausar, remover) vem antes.
appId: ${APP_ID}
---
# Fluxos criticos (DEC-7): Opcoes da fila — Intervalo e volta, Fechar fila
# (confirma) e Reabrir. Termina em Trabalhando, com a fila aberta.
- tapOn:
    text: "Opções da fila"
    label: "05.25 · toca em Opções da fila"
- tapOn:
    text: "Intervalo"
    label: "05.26 · toca em Intervalo"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "05.27 · roda fechar_aviso"
- extendedWaitUntil:
    visible: "Você está: Intervalo.*"
    timeout: 20000
    label: "05.28 · espera Você está: Intervalo"
- tapOn:
    text: "Trabalhando"
    label: "05.29 · toca em Trabalhando"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "05.30 · roda fechar_aviso"
- extendedWaitUntil:
    visible: "Você está: Trabalhando.*"
    timeout: 20000
    label: "05.31 · espera Você está: Trabalhando"
- tapOn:
    text: "Fechar fila"
    label: "05.32 · toca em Fechar fila"
- runFlow:
    file: ../apoio/confirmar.yaml
    label: "05.33 · confirma Fechar fila"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "05.34 · roda fechar_aviso"
- extendedWaitUntil:
    visible: "Reabrir fila"
    timeout: 20000
    label: "05.35 · espera Reabrir fila"
- tapOn:
    text: "Reabrir fila"
    label: "05.36 · toca em Reabrir fila"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "05.37 · roda fechar_aviso"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "05.38 · roda fechar_aviso"
- extendedWaitUntil:
    visible: "Fechar fila"
    timeout: 20000
    label: "05.39 · espera Fechar fila (fila aberta)"
- assertVisible:
    text: "Você está: Trabalhando.*"
    label: "05.40 · confere Você está: Trabalhando"
# expor-posicao (35d57c0): esconder a posicao e voltar a mostrar
- scrollUntilVisible:
    element:
      id: "expor-posicao"
    direction: DOWN
    label: "05.40a · rola ate Mostrar a posicao na fila"
- tapOn:
    id: "expor-posicao"
    label: "05.40b · desliga Mostrar a posicao"
- extendedWaitUntil:
    visible: "O cliente não vê a posição.*"
    timeout: 20000
    label: "05.40c · espera o cliente nao ve a posicao"
- tapOn:
    id: "expor-posicao"
    label: "05.40d · liga de novo"
- extendedWaitUntil:
    visible: "O cliente vê a posição dele na fila."
    timeout: 20000
    label: "05.40e · espera o cliente ve a posicao"
- tapOn:
    id: "aba-fila"
    label: "05.41 · toca em aba-fila"
