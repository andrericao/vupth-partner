# Grava a foto pela galeria (foto-pela-bateria, Andre 03/10). env: QUAL
# (foto-perfil | foto-loja — o testID do FotoEditavel). O setup.sh empurrou a
# imagem de teste (apoio/foto_teste.png) para o celular; e a mais recente.
# O seletor de fotos e o recorte sao do Android — os seletores aceitam os dois
# idiomas e as variacoes mais comuns.
appId: ${APP_ID}
---
- tapOn:
    id: "${QUAL}-editar"
- tapOn:
    id: "${QUAL}-galeria"
# Seletor de fotos do sistema: a 1a foto da grade e a mais recente
- extendedWaitUntil:
    visible: "(Foto|Photo|Imagem|Image) .+"
    timeout: 20000
- tapOn:
    text: "(Foto|Photo|Imagem|Image) .+"
    index: 0
# Recorte (allowsEditing): confirma, se a tela aparecer. Espera ela abrir antes
# de decidir — o "when" sozinho olhava cedo demais e o recorte ficava aberto
# (log 06/10, 07.44).
- extendedWaitUntil:
    visible: "(Crop|CROP|Cortar|CORTAR|Recortar|RECORTAR|Concluído|Done|OK)"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "(Crop|CROP|Cortar|CORTAR|Recortar|RECORTAR|Concluído|Done|OK)"
    commands:
      - tapOn: "(Crop|CROP|Cortar|CORTAR|Recortar|RECORTAR|Concluído|Done|OK)"
# O recorte pode ignorar o 1o toque enquanto carrega a imagem (log 10/10 15:00,
# 08.36: o CROP ficou na tela): espera e toca de novo.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "(Crop|CROP|Cortar|CORTAR|Recortar|RECORTAR)"
    commands:
      - tapOn: "(Crop|CROP|Cortar|CORTAR|Recortar|RECORTAR)"
- runFlow:
    file: fechar_aviso.yaml
# Enviou: o rotulo vira "Editar foto"
- extendedWaitUntil:
    visible: "Editar foto"
    timeout: 60000
    optional: true
# Seletor e recorte sao do Android, nao do app (Andre, 10/10: "erra toda vez na
# hora de selecionar foto"): se a foto nao gravou, o print vai para o Andre, a
# bateria volta ao app e segue — o resto da etapa nao depende da foto.
- runFlow:
    when:
      notVisible: "Editar foto"
    commands:
      - runFlow:
          file: para_o_andre.yaml
          env:
            NOME: foto-nao-gravou-${QUAL}
            O_QUE: "a foto nao gravou pelo seletor do Android (seletor ou recorte na tela?)"
      - repeat:
          times: 3
          while:
            notVisible:
              id: "${QUAL}-editar"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 2000
