# Grava a foto pela galeria (foto-pela-bateria, Andre 03/10). env: QUAL
# (foto-perfil | foto-loja — o testID do FotoEditavel). O setup.sh empurrou a
# imagem de teste (apoio/foto_teste.png) para o celular; e a mais recente.
# O seletor de fotos e o recorte sao do Android — os seletores aceitam os dois
# idiomas e as variacoes mais comuns.
appId: ${APP_ID}
---
- tapOn:
    id: "${QUAL}-editar"
- tapOn:
    id: "${QUAL}-galeria"
# Seletor de fotos do sistema: a 1a foto da grade e a mais recente
- extendedWaitUntil:
    visible: "(Foto|Photo|Imagem|Image) .+"
    timeout: 20000
- tapOn:
    text: "(Foto|Photo|Imagem|Image) .+"
    index: 0
# Recorte (allowsEditing): confirma, se a tela aparecer
- runFlow:
    when:
      visible: "(Crop|CROP|Cortar|CORTAR|Recortar|RECORTAR|Concluído|Done|OK)"
    commands:
      - tapOn: "(Crop|CROP|Cortar|CORTAR|Recortar|RECORTAR|Concluído|Done|OK)"
- runFlow:
    file: fechar_aviso.yaml
# Enviou: o rotulo vira "Editar foto"
- extendedWaitUntil:
    visible: "Editar foto"
    timeout: 60000
