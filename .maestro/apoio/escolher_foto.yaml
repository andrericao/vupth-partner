# Grava a foto pela galeria (foto-pela-bateria, Andre 03/10). env: QUAL
# (foto-perfil | foto-loja — o testID do FotoEditavel). O setup.sh empurrou a
# imagem de teste (apoio/foto_teste.png) para o celular; e a mais recente.
# O seletor de fotos e do Android (o recorte e do app, foto-ux) — os seletores aceitam os dois
# idiomas e as variacoes mais comuns.
appId: ${APP_ID}
---
- tapOn:
    id: "${QUAL}-editar"
- tapOn:
    id: "${QUAL}-galeria"
# Seletor de fotos do sistema: a 1a foto da grade e a mais recente
- extendedWaitUntil:
    visible: "((Foto|Photo|Imagem|Image) .+|Recent|Recentes)"
    timeout: 20000
- runFlow:
    when:
      visible: "(Foto|Photo|Imagem|Image) .+"
    commands:
      - tapOn:
          text: "(Foto|Photo|Imagem|Image) .+"
          index: 0
# No emulador (Android 11, log 2026-10-11_013321, 08.36) o seletor e o
# "Recent" do DocumentsUI: miniaturas sem texto. Toca na 1a da grade.
- runFlow:
    when:
      visible: "(Recent|Recentes)"
    commands:
      - tapOn:
          point: "20%,31%"
# foto-ux (Andre, 15/10): o recorte do Android saiu; o "Ajuste a foto" e do
# app, com Cancelar e Usar foto escritos.
- extendedWaitUntil:
    visible:
      id: "${QUAL}-usar"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "${QUAL}-usar"
    commands:
      - assertVisible: "Ajuste a foto"
      - assertVisible:
          id: "${QUAL}-recorte-cancelar"
      - tapOn:
          id: "${QUAL}-usar"
- runFlow:
    file: fechar_aviso.yaml
# Enviou: o rotulo vira "Editar foto"
- extendedWaitUntil:
    visible: "Editar foto"
    timeout: 60000
    optional: true
# Seletor e recorte sao do Android, nao do app (Andre, 10/10: "erra toda vez na
# hora de selecionar foto"): se a foto nao gravou, o print vai para o Andre, a
# bateria volta ao app e segue — o resto da etapa nao depende da foto.
- runFlow:
    when:
      notVisible: "Editar foto"
    commands:
      - runFlow:
          file: para_o_andre.yaml
          env:
            NOME: foto-nao-gravou-${QUAL}
            O_QUE: "a foto nao gravou pelo seletor do Android (seletor ou recorte na tela?)"
      - repeat:
          times: 3
          while:
            notVisible:
              id: "${QUAL}-editar"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 2000
