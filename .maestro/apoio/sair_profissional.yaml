# Sai da conta pela aba Perfil e volta a tela de papeis.
appId: ${APP_ID}
---
- tapOn:
    id: "aba-perfil"
- runFlow: fechar_aviso.yaml
# Log 2026-10-11_231425 (07.A7): com a Chave Pix o Perfil cresceu e o "Sair da
# conta" fica rente a barra de abas — basta metade visivel.
- scrollUntilVisible:
    element: "Sair da conta"
    direction: DOWN
    visibilityPercentage: 50
- tapOn: "Sair da conta"
# Log 2026-10-30_193632 (01.A7): o Perfil recarregou (cadastro incompleto) e o scroll
# voltou ao topo antes do toque pegar; sem caixa, rola e toca de novo.
- runFlow:
    when:
      notVisible:
        id: "dialogo-botao-1"
    commands:
      - scrollUntilVisible:
          element: "Sair da conta"
          direction: DOWN
          visibilityPercentage: 50
      - tapOn: "Sair da conta"
- runFlow: confirmar.yaml
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 20000
