# Abre o app do zero e garante que roda o OTA (bateria-00-11, 03/10). O
# clearState apaga o OTA baixado: a 1a abertura roda o bundle do APK e baixa o
# OTA por tras; so uma abertura DEPOIS do download o aplica. Fechar logo (como
# antes) reabria o bundle do APK, que nao tem o app-commit. Aqui: espera ate
# 15 s com o app aberto (o download corre), fecha, reabre — ate o rodape trazer
# o commit (so o codigo novo o tem), no maximo 4 vezes.
appId: ${APP_ID}
---
- runFlow:
    file: fechar_cortina.yaml
# push-conta-errada (S43, Backend 657a119): o clearState troca o token do push
# sem tirar o velho da conta anterior — o push dela chegava depois, na conta
# nova. Antes de limpar, sai da conta que ficou logada (o logout desregistra o
# token). Etapa que terminou bem ja saiu: ai nao ha aba e nada acontece.
- launchApp
- extendedWaitUntil:
    visible:
      id: "(aba-perfil|aba-menu)"
    timeout: 15000
    optional: true
- runFlow:
    file: fechar_aviso.yaml
- runFlow:
    when:
      visible:
        id: "aba-perfil"
    file: sair_profissional.yaml
- runFlow:
    when:
      visible:
        id: "aba-menu"
    file: sair_dono.yaml
# Logs 2026-10-31_213501 e 221040 (07a): o APK traz um bundle embutido que TAMBEM
# mostra o app-commit (o do build). Esperar so o id parava no bundle velho e a
# etapa rodava a tela antiga. Agora espera o commit ESPERADO (COMMIT do setup.sh,
# lista separada por virgula); sem COMMIT (maestro test direto), qualquer um serve.
- evalScript:
    script: "${output.COMMIT_ESPERADO = (typeof COMMIT !== 'undefined' && COMMIT) ? '.*(' + String(COMMIT).split(',').map(function (c) { return c.trim(); }).filter(function (c) { return c; }).join('|') + ').*' : '.+'}"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 120000
- repeat:
    times: 4
    while:
      notVisible:
        id: "app-commit"
        text: ${output.COMMIT_ESPERADO}
    commands:
      - extendedWaitUntil:
          visible:
            id: "app-commit"
            text: ${output.COMMIT_ESPERADO}
          timeout: 15000
          optional: true
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "Como você vai usar o Vupth?"
          timeout: 120000
# maestro-trava-na-atualizacao: o repeat acima acaba sem erro mesmo sem o commit na
# tela (OTA que nao chegou). Aqui reprova, com o nome do problema.
- extendedWaitUntil:
    visible:
      id: "app-commit"
      text: ${output.COMMIT_ESPERADO}
    timeout: 20000
    label: "reprova se o OTA nao chegou (sem o commit esperado no rodape da entrada)"
- runFlow:
    file: fechar_cortina.yaml
