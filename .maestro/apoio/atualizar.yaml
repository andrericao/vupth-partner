# A fatia de atualizacao (Andre, 05/10; mesmo nome e lugar do Client): em vez
# de fechar e abrir o app ate o OTA valer, o profissional logado vai em Perfil
# -> Versao do app e toca em "Verificar atualizacao". Se baixou, o OK reinicia
# o app no OTA novo. No fim le o commit na linha da versao (output.INSTALADO).
#
# Comeca logado, com a barra de abas. Termina na tela Versao do app.
appId: ${APP_ID}
---
- tapOn:
    id: "aba-perfil"
- scrollUntilVisible:
    element:
      text: "Versão do app"
- tapOn:
    text: "Versão do app"
- tapOn:
    id: "check-update"
- extendedWaitUntil:
    visible: "(Atualização baixada|Tudo certo|Sem atualização)"
    timeout: 60000
# "Atualização baixada": o OK chama o reloadAsync e o app recomeca, logado.
- runFlow:
    when:
      visible: "Atualização baixada"
    commands:
      - runFlow:
          file: fechar_aviso.yaml
      - extendedWaitUntil:
          visible:
            id: "aba-perfil"
          timeout: 60000
      - runFlow:
          file: fechar_aviso.yaml
      - tapOn:
          id: "aba-perfil"
      - scrollUntilVisible:
          element:
            text: "Versão do app"
      - tapOn:
          text: "Versão do app"
# "Tudo certo" / "Sem atualizacao" vem no Alert do sistema (botao OK).
- runFlow:
    when:
      visible: "(Tudo certo|Sem atualização)"
    commands:
      - tapOn:
          text: "(OK|Ok)"
- runFlow:
    file: fechar_aviso.yaml
# A linha da versao termina no commit: "runtime · canal · OTA … · <commit>".
- copyTextFrom:
    id: "version-line"
- evalScript: ${output.INSTALADO = String(maestro.copiedText).split(' · ').pop().trim()}
