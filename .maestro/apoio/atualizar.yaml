# Comeca logado, com a barra de abas. Termina na tela Versao do app.
appId: ${APP_ID}
---
- tapOn:
    id: "aba-perfil"
- scrollUntilVisible:
    element:
      text: "Versão do app"
- tapOn:
    text: "Versão do app"
- tapOn:
    id: "check-update"

- extendedWaitUntil:
    visible: "(Atualização baixada|Tudo certo|Sem atualização|Não foi possível verificar)"
    timeout: 60000

# "Atualização baixada": o OK chama o reloadAsync e o app recomeca, logado.
- runFlow:
    when:
      visible: "(Atualização baixada|Tudo certo|Sem atualização|Não foi possível verificar)"
    commands:
      - runFlow:
          file: fechar_aviso.yaml
      - runFlow:
          when:
            visible:
              id: "android:id/button1"
          commands:
            - tapOn:
                id: "android:id/button1"
      - runFlow:
          when:
            visible:
              id: "dialogo-botao-0"
          commands:
            - tapOn:
                id: "dialogo-botao-0"
      - extendedWaitUntil:
          visible:
            id: "aba-perfil"
          timeout: 60000
      - runFlow:
          file: fechar_aviso.yaml
      - tapOn:
          id: "aba-perfil"
      - scrollUntilVisible:
          element:
            text: "Versão do app"
      - tapOn:
          text: "Versão do app"

# "Tudo certo" / "Sem atualizacao" vem no Alert do sistema (botao OK).
- runFlow:
    when:
      visible: "(Tudo certo|Sem atualização)"
    commands:
      - tapOn:
          id: "android:id/button1"

# Fechar qualquer aviso restante do app
- runFlow:
    file: fechar_aviso.yaml

# A linha da versao termina no commit: "runtime · canal · OTA … · <commit>".
# maestro-trava-na-atualizacao: sem a linha o fluxo REPROVA aqui (nao segue calado).
- extendedWaitUntil:
    visible:
      id: "version-line"
    timeout: 20000
    label: "espera a linha da versao (reprova se nao vier)"
- copyTextFrom:
    id: "version-line"
- evalScript: ${output.INSTALADO = String(maestro.copiedText).split(' · ').pop().trim()}
