# Sai da conta pelo Menu do dono e volta a tela de papeis.
appId: ${APP_ID}
---
- tapOn:
    id: "aba-menu"
- scrollUntilVisible:
    element: "Sair da conta"
    direction: DOWN
- tapOn: "Sair da conta"
- runFlow: confirmar.yaml
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 20000
