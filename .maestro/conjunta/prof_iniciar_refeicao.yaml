# Inicia a refeicao pela pergunta da Fila (bateria-conjunta, Andre 05/10: o
# Client confere que o profissional esta no almoco e o tempo da fila). A
# refeicao tem de estar na janela: cadastre antes com prof_refeicao.yaml e
# INICIO = agora. env: NOME (o da refeicao)
appId: ${APP_ID}
---
- tapOn:
    id: "aba-fila"
    label: "PJ11.01 · toca em aba-fila"
# O rotulo agora e "Iniciar" (era "Iniciar agora"), igual ao botao "Iniciar" do
# cartao da fila: o texto sozinho e ambiguo, entao a bateria usa o indice do
# botao na caixa (Agora não, Não ver mais, Pular hoje, Iniciar).
- extendedWaitUntil:
    visible:
      id: "dialogo-botao-3"
    timeout: 60000
    label: "PJ11.02 · espera a pergunta Hora do ${NOME}"
- tapOn:
    id: "dialogo-botao-3"
    label: "PJ11.03 · toca em Iniciar"
- extendedWaitUntil:
    notVisible:
      id: "dialogo-botao-3"
    timeout: 20000
    label: "PJ11.04 · a refeicao comecou"
