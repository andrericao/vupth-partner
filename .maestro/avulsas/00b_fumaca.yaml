# TESTE DE FUMACA do Partner (smoke test; teste-do-essencial, DEC-157). AVULSA: prepara pela API
# (conta e loja so desta etapa, pela TAG), abre o app do zero e roda etapas/00b_fumaca.yaml.
# Roda primeiro na rodada; falhou, nada mais roda. Meta: menos de 5 min.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.partner.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
# ⚠️ TAG e COMMIT NAO entram no env: ele e aplicado DEPOIS do -e da linha de
# comando e o apaga (Client, 04/10: a conferencia de versao era pulada e cada
# etapa avulsa fazia a sua TAG). O setup.sh os passa por -e; sem eles (maestro
# test direto), as expressoes testam typeof.
---
# Sufixo f: a conta e so da fumaca. Com a TAG da rodada, a 01 tentava cadastrar o mesmo
# e-mail e parava em "Este e-mail ja esta cadastrado" (log 2026-11-06_162133, 01.02).
- evalScript:
    script: "${output.TAG = (typeof TAG !== 'undefined' && TAG ? String(TAG) : String(Date.now()).slice(-6)) + 'f'}"
    label: "00b.A1 · etiqueta da fumaca (TAG da rodada + f)"
- evalScript:
    script: ${output.EMAIL_DONO = 'prop_m' + output.TAG + '@teste.com'}
    label: "00b.A2 · e-mail do dono"
- evalScript:
    script: ${output.EMAIL_PROF = 'prof_m' + output.TAG + '@teste.com'}
    label: "00b.A3 · e-mail do profissional"
- evalScript:
    script: ${output.LOJA = 'Loja M' + output.TAG}
    label: "00b.A4 · nome da loja"
- evalScript:
    script: ${output.PROF = 'Prof' + output.TAG}
    label: "00b.A5 · nome do profissional"
- runScript:
    file: ../scripts/preparo.js
    env:
      TAG: ${output.TAG}
      ETAPA: "5"
    label: "00b.A6 · preparo pela API (loja, vinculo, servico, Trabalhando)"
- runFlow:
    file: ../apoio/abrir_com_ota.yaml
    label: "00b.A7 · abre o app do zero, ja com o OTA"
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_PROF}
    label: "00b.B1 · entra como o profissional"
- extendedWaitUntil:
    visible:
      id: "aba-fila"
    timeout: 30000
    label: "00b.B2 · espera aba-fila"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "00b.B3 · fecha avisos"
- runFlow:
    file: ../etapas/00b_fumaca.yaml
    label: "00b.00 · roda 00b_fumaca"
