# Etapa 07 AVULSA (bateria-nao-para, Andre 03/10): prepara pela API o estado
# que ela espera, abre o app do zero e roda etapas/07_encaixe.yaml. O setup.sh
# roda as oito em sequencia com a mesma TAG e segue depois de uma falha.
# Gerado junto com as demais — mudar o cabecalho nas oito.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.partner.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
  TAG: ""
---
- evalScript:
    script: "${output.TAG = TAG ? String(TAG) : String(Date.now()).slice(-6)}"
    label: "07.A1 · etiqueta da rodada (TAG)"
- evalScript:
    script: ${output.EMAIL_DONO = 'prop_m' + output.TAG + '@teste.com'}
    label: "07.A2 · e-mail do dono"
- evalScript:
    script: ${output.EMAIL_PROF = 'prof_m' + output.TAG + '@teste.com'}
    label: "07.A3 · e-mail do profissional"
- evalScript:
    script: ${output.LOJA = 'Loja M' + output.TAG}
    label: "07.A4 · nome da loja"
- evalScript:
    script: ${output.PROF = 'Prof' + output.TAG}
    label: "07.A5 · nome do profissional"
- runScript:
    file: ../scripts/preparo.js
    env:
      TAG: ${output.TAG}
      ETAPA: "7"
    label: "07.A6 · preparo pela API (o que as etapas anteriores deixariam)"
# clearState apaga o OTA baixado: a 1a abertura baixa, a 2a aplica.
- launchApp:
    clearState: true
    label: "07.A7 · abre o app do zero"
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 120000
    label: "07.A8 · espera Como você vai usar o Vupth?"
- stopApp:
    label: "07.A9 · fecha o app (o OTA entra na proxima abertura)"
- launchApp:
    label: "07.B1 · abre o app de novo"
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 120000
    label: "07.B2 · espera Como você vai usar o Vupth?"
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_PROF}
    label: "07.B3 · entra como o profissional"
- extendedWaitUntil:
    visible:
      id: "aba-fila"
    timeout: 30000
    label: "07.B4 · espera aba-fila"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "07.B5 · roda fechar_aviso"
- runFlow:
    file: ../etapas/07_encaixe.yaml
    label: "07.00 · roda 07_encaixe"
