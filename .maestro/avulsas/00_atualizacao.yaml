# Antes das etapas: a fatia de atualizacao (fatia-de-atualizacao, Andre 05/10;
# mesmo nome e lugar do Client). Entra, toca em "Verificar atualizacao" e
# confere o commit (bateria-confere-versao). Se nao bater, o setup.sh nao roda
# as etapas — testar a versao errada nao serve.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.partner.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
# ⚠️ TAG e COMMIT NAO entram no env: ele e aplicado DEPOIS do -e da linha de
# comando e o apaga (Client, 04/10). O setup.sh os passa por -e; sem eles
# (maestro test direto), as expressoes testam typeof.
---
- evalScript:
    script: "${output.TAG = typeof TAG !== 'undefined' && TAG ? String(TAG) : String(Date.now()).slice(-6)}"
    label: "00.01 · etiqueta da rodada (TAG)"
- runScript:
    file: ../scripts/conta_da_versao.js
    env:
      TAG: ${output.TAG}
    label: "00.02 · conta de profissional so da 00, pela API"
# Log 2026-10-11_155533 (00.04): a 12 da rodada anterior falhou com a cortina
# aberta, e a 00 abriu o app por baixo dela. Fecha a cortina antes e depois.
- runFlow:
    file: ../apoio/fechar_cortina.yaml
    label: "00.02a · fecha a cortina de notificacoes, se ficou aberta"
- launchApp:
    clearState: true
    label: "00.03 · abre o app do zero"
- runFlow:
    file: ../apoio/fechar_cortina.yaml
    label: "00.03a · fecha a cortina, se ainda estiver na tela"
# abertura-profissional (PAR-10, DEC-40): a abertura (o V) nao fala de servidor.
- assertNotVisible:
    text: ".*[Ss]ervidor.*"
    label: "00.03b · abertura · nenhum texto de servidor"
# emulador-lento (log 10/10 19:09, 00.04): no emulador o "Process system isn't
# responding" cobre a entrada enquanto o app sobe. Espera em pedacos e, entre
# eles, toca em Wait se o aviso estiver na tela.
- repeat:
    times: 6
    while:
      notVisible: "Como você vai usar o Vupth?"
    commands:
      - runFlow:
          file: ../apoio/fechar_anr.yaml
      - extendedWaitUntil:
          visible: "Como você vai usar o Vupth?"
          timeout: 20000
          optional: true
    label: "00.04a · espera a entrada (tocando em Wait no aviso do Android)"
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 10000
    label: "00.04 · espera a entrada"
# maestro-atualizacao-por-commit (Andre, 28/10): o setup.sh guarda o commit ja
# verificado (aparelho + instalacao + commit). Igual ao de agora, PULAR_ATUALIZACAO=1:
# nao toca em "Verificar atualizacao"; o commit instalado vem do rodape da entrada
# (app-commit) e o 00.12 confere do mesmo jeito.
- evalScript:
    script: "${output.PULAR = typeof PULAR_ATUALIZACAO !== 'undefined' && String(PULAR_ATUALIZACAO) === '1'}"
    label: "00.04b · o commit ja foi verificado? (PULAR_ATUALIZACAO)"
- runFlow:
    when:
      true: ${output.PULAR}
    commands:
      - extendedWaitUntil:
          visible:
            id: "app-commit"
          timeout: 20000
          label: "00.04c · espera o commit no rodape da entrada"
      - copyTextFrom:
          id: "app-commit"
      - evalScript: ${output.INSTALADO = String(maestro.copiedText).trim()}
- runFlow:
    file: ../apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_VERSAO}
    label: "00.05 · entra como o profissional da 00"
- extendedWaitUntil:
    visible:
      id: "aba-perfil"
    timeout: 30000
    label: "00.06 · espera aba-perfil"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "00.07 · roda fechar_aviso"
# A memoria do commit verificado pode mentir (emulador restaurado, OTA nao aplicado:
# 30/10, instalado 41914ff com a memoria de 44d451e). Se o rodape nao bate com o
# esperado, a 00 atualiza em vez de reprovar de cara.
- evalScript:
    script: >-
      ${output.ATUALIZAR = !output.PULAR || !String(typeof COMMIT === 'undefined' ? '' : COMMIT).split(',').map(function (c) { return c.trim(); }).filter(function (c) { return c; }).some(function (e) { var i = String(output.INSTALADO || '').trim(); return i && (i.indexOf(e) === 0 || e.indexOf(i) === 0); })}
    label: "00.07b · precisa verificar atualização? (memória não bate com o rodapé)"
- runFlow:
    when:
      true: ${output.ATUALIZAR}
    file: ../apoio/atualizar.yaml
    label: "00.08 · Perfil → Versão do app → Verificar atualização"
- runScript:
    file: ../scripts/confere_versao.js
    env:
      INSTALADO: ${output.INSTALADO}
    label: "00.12 · confere a versão: o commit instalado é o esperado?"
