# Etapa 01 AVULSA (bateria-nao-para, Andre 03/10): prepara pela API o estado
# que ela espera, abre o app do zero e roda etapas/01_dono_cadastra_a_loja.yaml. O setup.sh
# roda as oito em sequencia com a mesma TAG e segue depois de uma falha.
# Gerado junto com as demais — mudar o cabecalho nas oito.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.partner.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
  TAG: ""
---
- evalScript:
    script: "${output.TAG = TAG ? String(TAG) : String(Date.now()).slice(-6)}"
    label: "01.A1 · etiqueta da rodada (TAG)"
- evalScript:
    script: ${output.EMAIL_DONO = 'prop_m' + output.TAG + '@teste.com'}
    label: "01.A2 · e-mail do dono"
- evalScript:
    script: ${output.EMAIL_PROF = 'prof_m' + output.TAG + '@teste.com'}
    label: "01.A3 · e-mail do profissional"
- evalScript:
    script: ${output.LOJA = 'Loja M' + output.TAG}
    label: "01.A4 · nome da loja"
- evalScript:
    script: ${output.PROF = 'Prof' + output.TAG}
    label: "01.A5 · nome do profissional"
# clearState apaga o OTA baixado: a 1a abertura baixa, a 2a aplica.
- launchApp:
    clearState: true
    label: "01.A7 · abre o app do zero"
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 120000
    label: "01.A8 · espera Como você vai usar o Vupth?"
- stopApp:
    label: "01.A9 · fecha o app (o OTA entra na proxima abertura)"
- launchApp:
    label: "01.B1 · abre o app de novo"
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 120000
    label: "01.B2 · espera Como você vai usar o Vupth?"
- runFlow:
    file: ../etapas/01_dono_cadastra_a_loja.yaml
    label: "01.00 · roda 01_dono_cadastra_a_loja"
