# Antes das etapas: o app instalado e o codigo esperado (bateria-confere-versao).
# Se falhar, o setup.sh nao roda as etapas — testar a versao errada nao serve.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.partner.preview
  COMMIT: ""
---
- launchApp:
    clearState: true
    label: "00.06 · abre o app"
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 120000
    label: "00.07 · espera Como você vai usar o Vupth?"
- stopApp:
    label: "00.08 · fecha o app (o OTA baixado entra na proxima abertura)"
- launchApp:
    label: "00.09 · abre o app de novo"
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: 120000
    label: "00.10 · espera Como você vai usar o Vupth?"
- copyTextFrom:
    id: "app-commit"
    label: "00.11 · le o commit do app (rodape da entrada)"
- runScript:
    file: ../scripts/confere_versao.js
    env:
      INSTALADO: ${maestro.copiedText}
    label: "00.12 · confere a versão: o commit instalado está em ${COMMIT}?"
