appId: host.exp.exponent
---
# Teste: Profissional logado navega pelas telas
# Usa conta do TEST_ACCOUNTS.md (prof1_97616@teste.com)
# Rodar: maestro test .maestro/test_professional_screens.yaml

# 1. Ir para Login
# Portao de cold start (readiness): o app mostra "Preparando servidor..." ate o
# backend acordar (~50s no Render). Espera estendida ate a tela de papeis.
- extendedWaitUntil:
    visible: "Como deseja usar o VUPTH?"
    timeout: 90000
- tapOn: "Sou profissional"
- assertVisible: "Cadastrar"
- tapOn: "Login"
- assertVisible: "Login"

# 2. Fazer login como profissional
- tapOn:
    id: "login-email"
- inputText: "prof1_97616@teste.com"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "Teste@123"
- hideKeyboard
- tapOn: "Entrar"

# 3. Tela de Fila (tab Fila)
- assertVisible: "Minha Fila"

# 4. Navegar para tab Perfil
- tapOn: "Perfil"
- assertVisible: "Atendimentos"
- assertVisible: "Relatorios"
- assertVisible: "Meus Servicos"
- assertVisible: "Configuracoes"
- assertVisible: "Sair"

# 5. Abrir Atendimentos
- tapOn: "Atendimentos"
- assertVisible: "Atendimentos"
- assertVisible: "Em andamento"
- assertVisible: "Realizados"
- back

# 6. Abrir Relatorios
- tapOn: "Relatorios"
- assertVisible: "Relatorios"
- assertVisible: "Hoje"
- assertVisible: "Semana"
- assertVisible: "Mes"
- tapOn: "Semana"
- assertVisible: "Em breve"
- tapOn: "Hoje"
- back

# 7. Abrir Meus Servicos
- tapOn: "Meus Servicos"
- assertVisible: "Meus Servicos"
- back

# 8. Abrir Configuracoes
- tapOn: "Configuracoes"
- assertVisible: "Configuracoes"
- assertVisible: "Nome"
- assertVisible: "E-mail"
- assertVisible: "Senha"
- assertVisible: "Estabelecimento"
- back

# 9. Logout
- tapOn: "Sair"
- assertVisible: "Como deseja usar o VUPTH?"
