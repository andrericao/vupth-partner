# ════════════════════════════════════════════════════════════════════════════
# BATERIA COMPLETA do partner — Maestro, no APK de PREVIEW, contra o STAGING
# (Render). Decisao do Andre, 25/09: "prefiro com render, mas a bateria deve ser
# completa".
#
#   bash .maestro/setup.sh   # celular, teclado, servidor, commit — e roda
#   (logs em logs/maestro/<data>; --so-preparar so imprime o comando)
#
# Cada rodada cria contas NOVAS (sufixo = hora da rodada), entao pode repetir a
# vontade. Os clientes nao vem do app do client: entram na fila e pedem encaixe
# pela API do staging (scripts/), com contas client_<tag>_*@teste.com.
#
# As etapas dependem umas das outras (uma cria o que a proxima usa), por isso
# e UM roteiro que chama as oito em ordem.
# ════════════════════════════════════════════════════════════════════════════
appId: ${APP_ID}
env:
  APP_ID: com.vupth.partner.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
# ⚠️ TAG e COMMIT NAO entram no env: ele e aplicado DEPOIS do -e da linha de
# comando e o apaga (Client, 04/10: a conferencia de versao era pulada e cada
# etapa avulsa fazia a sua TAG). O setup.sh os passa por -e; sem eles (maestro
# test direto), as expressoes testam typeof.
---
- evalScript:
    script: ${output.TAG = String(Date.now()).slice(-6)}
    label: "00.01 · calcula a etiqueta da rodada (TAG)"
- evalScript:
    script: ${output.EMAIL_DONO = 'prop_m' + output.TAG + '@teste.com'}
    label: "00.02 · calcula o e-mail do dono"
- evalScript:
    script: ${output.EMAIL_PROF = 'prof_m' + output.TAG + '@teste.com'}
    label: "00.03 · calcula o e-mail do profissional"
- evalScript:
    script: ${output.LOJA = 'Loja M' + output.TAG}
    label: "00.04 · calcula o nome da loja"
- evalScript:
    script: ${output.PROF = 'Prof' + output.TAG}
    label: "00.05 · calcula o nome do profissional"

# O app abre na tela "preparando servidor" ate o staging responder (~50 s se
# ele estava dormindo). O setup.sh ja o acorda; aqui so esperamos.
- runFlow:
    file: apoio/abrir_com_ota.yaml
    label: "00.06 · abre o app do zero e espera o OTA entrar (ate 4 reaberturas)"
- assertVisible:
    id: "app-commit"
    label: "00.10 · o rodape traz o commit (sem ele: o OTA nao chegou ao aparelho)"
- copyTextFrom:
    id: "app-commit"
    label: "00.11 · le o commit do app (rodape da entrada)"
- runScript:
    file: scripts/confere_versao.js
    env:
      INSTALADO: ${maestro.copiedText}
    label: "00.12 · confere a versão: o commit instalado é o esperado?"

- runFlow:
    file: etapas/01_dono_cadastra_a_loja.yaml
    label: "00.13 · roda 01_dono_cadastra_a_loja"
- runFlow:
    file: etapas/02_profissional_pede_vinculo.yaml
    label: "00.14 · roda 02_profissional_pede_vinculo"
- runFlow:
    file: etapas/03_dono_aceita_o_vinculo.yaml
    label: "00.15 · roda 03_dono_aceita_o_vinculo"
- runFlow:
    file: etapas/04_profissional_monta_o_atendimento.yaml
    label: "00.16 · roda 04_profissional_monta_o_atendimento"
- runFlow:
    file: etapas/05_atende_a_fila.yaml
    label: "00.17 · roda 05_atende_a_fila"
- runFlow:
    file: etapas/06_meu_dia.yaml
    label: "00.18 · roda 06_meu_dia"
- runFlow:
    file: etapas/07_encaixe.yaml
    label: "00.19 · roda 07_encaixe"
- runFlow:
    file: etapas/08_dono_confere.yaml
    label: "00.20 · roda 08_dono_confere"
# A 08 termina com o dono fora da conta; a 09 e do profissional
- runFlow:
    file: apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_PROF}
    label: "00.21 · entra como o profissional"
- extendedWaitUntil:
    visible:
      id: "aba-fila"
    timeout: 30000
    label: "00.22 · espera aba-fila"
- runFlow:
    file: etapas/09_profissional_extras.yaml
    label: "00.23 · roda 09_profissional_extras"
# A 09 termina fora da conta; a 10 tem profissional proprio (muda o vinculo)
- runScript:
    file: scripts/troca_de_loja.js
    env:
      EMAIL_DONO: ${output.EMAIL_DONO}
      TAG: ${output.TAG}
    label: "00.24 · script troca_de_loja"
- runFlow:
    file: apoio/abrir_com_ota.yaml
    label: "00.25 · abre o app do zero"
- runFlow:
    file: apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_TROCA}
    label: "00.26 · entra como o profissional da troca"
- extendedWaitUntil:
    visible:
      id: "aba-fila"
    timeout: 30000
    label: "00.27 · espera aba-fila"
- runFlow:
    file: etapas/10_profissional_troca_de_loja.yaml
    label: "00.28 · roda 10_profissional_troca_de_loja"
# A 10 termina na tela de papeis (o login errado); a 11 tem profissional proprio
- runScript:
    file: scripts/troca_de_loja.js
    env:
      EMAIL_DONO: ${output.EMAIL_DONO}
      TAG: ${output.TAG}
      QUEM: Abre
    label: "00.29 · script troca_de_loja (Abre)"
- runFlow:
    file: apoio/entrar.yaml
    env:
      EMAIL: ${output.EMAIL_ABRE}
    label: "00.30 · entra como o profissional que abre a loja"
- extendedWaitUntil:
    visible:
      id: "aba-fila"
    timeout: 30000
    label: "00.31 · espera aba-fila"
- runFlow:
    file: etapas/11_profissional_abre_a_loja.yaml
    label: "00.32 · roda 11_profissional_abre_a_loja"
